name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads the pinned pnpm version from the packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    # Activates automatically once the Dockerfiles from roadmap 1.3 exist.
    # Runs on GitHub runners, so no local Docker installation is required.
    if: hashFiles('apps/*/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build app images
        run: |
          for dockerfile in apps/*/Dockerfile; do
            app_dir=$(dirname "$dockerfile")
            docker build -t "fma-$(basename "$app_dir"):${GITHUB_SHA::12}" "$app_dir"
          done
