name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN (ASVS review N5): CI only reads.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Unit tests only: without DATABASE_URL/GREENMAIL_HOST the integration tests
    # skip themselves. They run in the Gitea nightly (msz/gitea-workflows).
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads the pinned pnpm version from the packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # High/critical advisories fail the build; reviewed exceptions are
        # listed with their reason in pnpm-workspace.yaml (auditConfig).
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  php:
    name: PHP backend (lint, static analysis, unit tests)
    runs-on: ubuntu-latest
    # Unit tests only, like the JS job: the integration suite needs
    # DATABASE_URL (MySQL/MariaDB) and runs in the nightly.
    defaults:
      run:
        working-directory: apps/server-php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Lowest supported version (ADR-0013).
          php-version: '8.2'
          extensions: openssl, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Code style
        run: composer cs

      - name: Static analysis
        run: composer analyse

      - name: Unit tests
        run: composer test
