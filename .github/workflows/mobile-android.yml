name: mobile-android

# Android preview build of the KMP app (apps/mobile, epic #136):
# shared tests, debug APK as artifact `fma-android-debug`.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Firebase config only from the secret, never from the repo. Without it
      # the app is built without the google-services plugin: push then falls
      # back to periodic polling (WorkManager).
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > androidApp/google-services.json
            echo "google-services.json written, building with FCM"
          else
            echo "No GOOGLE_SERVICES_JSON_B64 secret: building without FCM (polling fallback)"
          fi

      # Optional stable debug signing key, so a newer APK installs over the
      # previous one. Without it every run signs with a fresh debug key.
      - name: Debug signing key (optional)
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > androidApp/debug.keystore
          fi

      - name: Shared tests
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fma-android-debug
          path: apps/mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Starts the app on an emulator: catches crashes at launch (SDK setup,
  # Keystore, WorkManager, Firebase without config) before anyone sideloads.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest

  # The Kotlin API client against the real PHP API (#143): login with a
  # device token, read endpoints, push registration, logout.
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: mail_test
          MARIADB_USER: mail
          MARIADB_PASSWORD: mail
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://mail:mail@127.0.0.1:3306/mail_test
      SETUP_TOKEN: e2e-setup-code
      FMA_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start PHP API
        run: |
          composer install --no-interaction --no-progress -d apps/server-php
          export MASTER_KEY="$(openssl rand -base64 32)"
          php apps/server-php/bin/migrate.php
          php -S 127.0.0.1:3001 -t apps/server-php/public apps/server-php/public/index.php > php.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3001/api/health && break; sleep 1; done
      - name: Kotlin client against the API
        working-directory: apps/mobile
        run: ./gradlew --no-daemon :shared:jvmTest --tests 'net.fma.mail.ApiSmokeTest'
      - name: API log on failure
        if: failure()
        run: tail -n 100 php.log
