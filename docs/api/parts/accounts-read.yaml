paths:
  /api/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List mail accounts
      description: |
        Accounts of the current user ordered by `sortOrder`, then creation
        time. Never contains credentials or keys. `unreadCount` counts unread
        messages in the INBOX; `syncing` is true while a folder/message sync
        is queued (and eligible) or running.
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Add a mail account
      description: |
        Validates the input, then tests the IMAP and SMTP connection with the
        given credentials before anything is stored (broken accounts are not
        persisted). On success the credentials are stored encrypted, a
        default identity is created from the account address and an initial
        folder sync is queued. At most 20 accounts per user. Ports 993/465
        use implicit TLS, all other ports STARTTLS. Rate limit: 10 requests
        per minute and IP (`account-test`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Maximum number of accounts (20) reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '422':
          description: IMAP or SMTP connection test failed; nothing was stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountConnectionTestFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update a mail account
      description: |
        Every field is optional. Empty `user`/`password` strings (or null)
        mean "unchanged" - stored credentials are never sent to the client.
        When `imap` or `smtp` is given, the merged connection data is tested
        first (nothing is saved on failure); on success the error state is
        cleared and a folder sync is queued. SMTP credentials that equal the
        IMAP ones follow IMAP changes unless given explicitly. Changing
        `syncSince` also queues a folder sync; already stored older messages
        are kept. Rate limit: 10 requests per minute and IP (`account-test`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Updated account; `test` is present when the connection was re-tested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: IMAP or SMTP connection test failed; nothing was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountConnectionTestFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete a mail account
      description: |
        Deletes the account with all its identities, folders, messages,
        threads, outbox entries and jobs, and its data key (crypto-shredding).
        Encrypted files in the mail-data volume are removed asynchronously by
        the worker (`account_cleanup` job).
      responses:
        '204':
          description: Account deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/accounts/{id}/identities:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listIdentities
      tags: [identities]
      summary: List sender identities of an account
      description: Default identity first, then by address.
      responses:
        '200':
          description: Identity list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createIdentity
      tags: [identities]
      summary: Add a sender identity (alias)
      description: |
        Adds an alias to the account. Addresses are unique per account
        (case-insensitive). At most 20 identities per account. Whether the
        provider accepts the alias as sender is not verified. The body is
        validated before the account is looked up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIdentityRequest' }
      responses:
        '201':
          description: Identity created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Address already exists for the account, or identity limit (20) reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

  /api/identities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateIdentity
      tags: [identities]
      summary: Update a sender identity
      description: |
        Changes name and/or signature, or makes the identity the account's
        default (`isDefault: true`). At least one field is required.
        `isDefault: false` is rejected - choose another identity as default
        instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIdentityRequest' }
      responses:
        '200':
          description: Updated identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteIdentity
      tags: [identities]
      summary: Delete a sender identity
      description: The default identity cannot be deleted. Queued outbox messages keep their stored sender.
      responses:
        '204':
          description: Identity deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The default identity cannot be deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

  /api/accounts/{id}/folders:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listFolders
      tags: [folders]
      summary: Get the folder tree of an account
      description: |
        Folders in tree pre-order (parents before children); among siblings
        INBOX first, then special-use folders, then by name. Counts are
        computed from the locally synced messages.
      responses:
        '200':
          description: Folder tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/folders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateFolderRole
      tags: [folders]
      summary: Assign or reset a folder role
      description: |
        Assigns a role (sent/drafts/trash/archive/junk) manually, or returns
        the folder to automatic detection with `specialUse: null`. A role is
        overridden on at most one folder per account (assigning it elsewhere
        moves it). Effective roles of all folders of the account are
        recomputed immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFolderRequest' }
      responses:
        '204':
          description: Role updated
        '400':
          description: Invalid role, folder not selectable (\Noselect), or INBOX given a role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/folders/{id}/load-older:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: loadOlderMessages
      tags: [folders]
      summary: Queue loading older messages of a folder
      description: |
        Enqueues a message sync that fetches the next batch below the lowest
        synced UID (ignores the account's `syncSince`). At most one such job
        per folder is queued or running; a repeated request answers
        `queued: false`. No request body.
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadOlderResponse' }
        '400':
          description: Folder cannot contain messages (\Noselect)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/folders/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listFolderMessages
      tags: [messages]
      summary: List messages of a folder (paginated)
      description: |
        Newest first (Date header, falling back to arrival time). Keyset
        pagination: pass `nextCursor` of the previous page as `cursor`;
        stable while new mail arrives.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor (`nextCursor` of the previous page); malformed values answer 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size; values above 100 are clamped to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '400':
          description: Invalid `cursor` or `limit`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getMessage
      tags: [messages]
      summary: Get message details
      description: |
        Headers, flags (union over all folders the message is in) and the
        plain-text body. Does not mark the message as read. The HTML body
        comes from `GET /api/messages/{id}/html`.
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/threads/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getThread
      tags: [messages]
      summary: Get a conversation
      description: |
        Messages of the conversation across all folders of the account
        (e.g. including Sent): the newest 200, returned oldest first.
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/actions:
    post:
      operationId: applyMessageAction
      tags: [messages]
      summary: Apply an action to messages of one folder
      description: |
        Read/unread, flag/unflag, archive, delete or move messages of ONE
        folder. Applied to the local database immediately (optimistic); the
        write-back to the IMAP server is queued as a job. `delete` moves to
        Trash, or deletes permanently when the folder is Trash. `archive`
        and `delete` need an Archive/Trash folder (else 409). Messages that
        are still being moved (placeholder location) answer 409 until their
        new UID is known.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageActionRequest' }
      responses:
        '200':
          description: Action applied locally; write-back queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageActionResponse' }
        '400':
          description: Invalid request, or message already in the target/archive folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Folder, a message in that folder, or target folder not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '409':
          description: No Archive/Trash folder for the account, or a message is still being moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

  /api/messages/{id}/html:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getMessageHtml
      tags: [messages]
      summary: Get the sanitized HTML body
      description: |
        Extracted on demand from the encrypted raw mail and sanitized. Inline
        `cid:` raster images are embedded as `data:` URLs (size-limited);
        remote images are removed unless `remote=1`. `html` is null when the
        message has no HTML part, its raw source is not synced yet, or it
        cannot be read/parsed. Render only in a sandboxed iframe.
      parameters:
        - name: remote
          in: query
          required: false
          description: '`1` keeps remote images/backgrounds; any other value blocks them.'
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: Sanitized HTML body
          headers:
            Cache-Control:
              description: Always `no-store`
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageHtmlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listMessageAttachments
      tags: [messages]
      summary: List attachments of a received message
      description: |
        Derived on demand from the encrypted raw mail. Empty list when the
        raw source is not synced yet or cannot be parsed.
      responses:
        '200':
          description: Attachment list
          headers:
            Cache-Control:
              description: Always `no-store`
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageAttachmentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/{id}/attachments/{index}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: index
        in: path
        required: true
        description: Attachment position as returned by the attachment list (0-based).
        schema: { type: integer, minimum: 0 }
    get:
      operationId: downloadMessageAttachment
      tags: [messages]
      summary: Download one attachment
      description: |
        Streams the decoded attachment. Only raster images
        (png/jpeg/gif/webp/avif/bmp) and `text/plain` are served with their
        own content type and may be shown inline (`inline=1`); every other
        type is sent as `application/octet-stream` with
        `Content-Disposition: attachment`. Always sandboxed by CSP.
      parameters:
        - name: inline
          in: query
          required: false
          description: '`1` requests `Content-Disposition: inline` (only honored for inline-safe types).'
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: Attachment content
          headers:
            Content-Type:
              description: Declared type for inline-safe types, else `application/octet-stream`
              schema: { type: string }
            Content-Disposition:
              description: '`attachment` or `inline` with `filename` (ASCII) and `filename*` (UTF-8)'
              schema: { type: string }
            Content-Security-Policy:
              description: Always this sandbox policy
              schema:
                type: string
                const: "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox"
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cross-Origin-Resource-Policy:
              schema: { type: string, const: same-origin }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
            image/*:
              schema: { type: string, contentMediaType: 'image/*' }
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Message or attachment not found (also for an invalid index or unsynced raw mail)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

  /api/accounts/{id}/search:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: searchAccount
      tags: [messages]
      summary: Search an account at the provider (IMAP SEARCH)
      description: |
        Runs IMAP SEARCH at the provider and maps the matching UIDs to
        locally synced messages (newest first, at most 100). Without
        `folderId`, INBOX and the other selectable folders except Junk/Trash
        are searched (at most 20). At least one criterion (`q`, `from`, `to`,
        `subject`, `since`, `before`, `unread`, `attachment`) is required. At
        most 10 provider searches per account and minute. The query is never
        logged or stored.
      parameters:
        - name: q
          in: query
          required: false
          description: Any text in headers and body (IMAP TEXT); trimmed, max 200 characters.
          schema: { type: string, maxLength: 200 }
        - name: from
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: subject
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/SearchTo'
        - $ref: '#/components/parameters/SearchUnread'
        - $ref: '#/components/parameters/SearchAttachment'
        - name: since
          in: query
          required: false
          description: Received on or after this day (UTC).
          schema: { type: string, format: date }
        - name: before
          in: query
          required: false
          description: Received before this day (exclusive); must be after `since`.
          schema: { type: string, format: date }
        - name: folderId
          in: query
          required: false
          description: Only this (selectable) folder of the account.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Search results
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400':
          description: Invalid or missing criteria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Account or folder not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '409':
          description: Account has an authentication error or is disabled (provider not contacted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '429':
          description: |
            Rate limit exceeded: more than 10 provider searches per account and
            minute (answered without `Retry-After`), or the global per-IP limit
            (with `Retry-After`).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the next attempt (global limit only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '502':
          description: Provider unreachable, credentials rejected, host/port blocked or STARTTLS missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchProviderError' }
        '504':
          description: Search at the provider exceeded the 30 s deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchProviderError' }

  /api/unified/inbox:
    get:
      operationId: listUnifiedInbox
      tags: [messages]
      summary: List the unified inbox (paginated, opt-in)
      description: |
        INBOX messages of all accounts, newest first, with the account and
        folder each one belongs to. Only available while the user setting
        `unifiedInbox` is on; otherwise 404. Same keyset pagination as the
        folder list.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor (`nextCursor` of the previous page); malformed values answer 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size; values above 100 are clamped to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnifiedMessageListResponse' }
        '400':
          description: Invalid `cursor` or `limit`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unified inbox is switched off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

components:
  schemas:
    # --- accounts ---------------------------------------------------------
    AccountStatus:
      type: string
      enum: [ok, auth_error, unreachable, disabled]
      description: '`auth_error` waits for new credentials; `unreachable` retries with backoff.'
    AccountErrorCode:
      type: string
      enum:
        - AUTH_FAILED
        - HOST_NOT_FOUND
        - CONNECTION_REFUSED
        - CONNECTION_LOST
        - TIMEOUT
        - TLS_ERROR
        - TLS_REQUIRED
        - BLOCKED_HOST
        - BLOCKED_PORT
        - JOB_TIMEOUT
        - CREDENTIALS_REQUIRED
        - RATE_LIMITED
    HostPort:
      type: object
      required: [host, port]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
    AccountSummary:
      type: object
      description: One mail account; never includes credentials or keys.
      required:
        - id
        - displayName
        - emailAddress
        - imap
        - smtp
        - status
        - lastErrorCode
        - nextRetryAt
        - capabilities
        - sortOrder
        - lastSyncAt
        - syncSince
        - unreadCount
        - syncing
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        emailAddress: { type: string, format: email }
        imap: { $ref: '#/components/schemas/HostPort' }
        smtp: { $ref: '#/components/schemas/HostPort' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        lastErrorCode:
          description: Last connection error (machine code only); null when healthy.
          oneOf:
            - $ref: '#/components/schemas/AccountErrorCode'
            - type: 'null'
        nextRetryAt:
          type: [string, 'null']
          format: date-time
          description: Next automatic connection attempt while the circuit is open.
        capabilities:
          type: array
          items: { type: string }
          description: IMAP capabilities (e.g. IDLE, CONDSTORE).
        sortOrder: { type: integer }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        syncSince:
          type: [string, 'null']
          format: date
          description: Sync only messages received on or after this day; null = no limit.
        unreadCount:
          type: integer
          minimum: 0
          description: Unread messages in the INBOX (0 in create/update responses).
        syncing:
          type: boolean
          description: A sync is queued or running (false in create/update responses).
    AccountListResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountSummary' }
    MailHost:
      type: string
      maxLength: 253
      description: DNS hostname or IP literal (no scheme, port or path); normalized to lower case.
    CreateAccountRequest:
      type: object
      required: [emailAddress, imap, smtp]
      properties:
        displayName:
          type: string
          description: Trimmed and cut to 100 characters; defaults to the email address.
        emailAddress:
          type: string
          format: email
          description: Trimmed and lower-cased.
        imap:
          type: object
          required: [host, port, user, password]
          properties:
            host: { $ref: '#/components/schemas/MailHost' }
            port:
              {
                type: integer,
                minimum: 1,
                maximum: 65535,
                description: '993 = implicit TLS, else STARTTLS',
              }
            user: { type: string, minLength: 1, description: Trimmed and cut to 320 characters. }
            password: { type: string, minLength: 1, writeOnly: true }
        smtp:
          type: object
          required: [host, port]
          properties:
            host: { $ref: '#/components/schemas/MailHost' }
            port:
              {
                type: integer,
                minimum: 1,
                maximum: 65535,
                description: '465 = implicit TLS, else STARTTLS',
              }
            user: { type: string, description: Empty or missing = IMAP user. }
            password:
              { type: string, writeOnly: true, description: Empty or missing = IMAP password. }
        syncSince:
          type: [string, 'null']
          format: date
          description: '`YYYY-MM-DD` between 1970-01-01 and today (UTC, one day slack); null/missing = all messages.'
    UpdateAccountRequest:
      type: object
      description: Every field optional; an empty object changes nothing.
      properties:
        displayName:
          type: string
          minLength: 1
          description: Trimmed and cut to 100 characters; must not be empty after trimming.
        sortOrder:
          type: integer
          minimum: -1000000
          maximum: 1000000
        syncSince:
          type: [string, 'null']
          format: date
          description: '`YYYY-MM-DD` between 1970-01-01 and today (UTC, one day slack); null = all messages.'
        imap: { $ref: '#/components/schemas/ConnectionUpdate' }
        smtp: { $ref: '#/components/schemas/ConnectionUpdate' }
    ConnectionUpdate:
      type: object
      description: Partial connection data; empty/null `user` or `password` = unchanged.
      properties:
        host: { $ref: '#/components/schemas/MailHost' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        user: { type: [string, 'null'], description: Trimmed and cut to 320 characters. }
        password: { type: [string, 'null'], writeOnly: true }
    ConnectionTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: Error code on failure.
          enum:
            - AUTH_FAILED
            - HOST_NOT_FOUND
            - CONNECTION_REFUSED
            - TIMEOUT
            - TLS_ERROR
            - TLS_REQUIRED
            - BLOCKED_HOST
            - BLOCKED_PORT
            - UNKNOWN
        message:
          type: string
          description: Human-readable error text on failure (never provider texts).
        capabilities:
          type: array
          items: { type: string }
          description: IMAP capabilities on success (IMAP test only).
    ConnectionTestPair:
      type: object
      required: [imap, smtp]
      properties:
        imap: { $ref: '#/components/schemas/ConnectionTestResult' }
        smtp: { $ref: '#/components/schemas/ConnectionTestResult' }
    CreateAccountResponse:
      type: object
      required: [account, test]
      properties:
        account: { $ref: '#/components/schemas/AccountSummary' }
        test: { $ref: '#/components/schemas/ConnectionTestPair' }
    UpdateAccountResponse:
      type: object
      required: [account]
      properties:
        account: { $ref: '#/components/schemas/AccountSummary' }
        test:
          $ref: '#/components/schemas/ConnectionTestPair'
          description: Present only when IMAP/SMTP data was changed and re-tested.
    AccountConnectionTestFailure:
      type: object
      required: [stage, test]
      properties:
        stage:
          type: string
          enum: [imap, smtp]
          description: Which test failed (SMTP is only tested after IMAP succeeded).
        test: { $ref: '#/components/schemas/ConnectionTestResult' }

    # --- identities -------------------------------------------------------
    ComposeIdentity:
      type: object
      required: [id, name, emailAddress, signature, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: May be empty. }
        emailAddress: { type: string, format: email }
        signature:
          type: [string, 'null']
          description: Plain-text signature without the "-- " delimiter; null = none.
        isDefault:
          type: boolean
          description: Default identity of the account.
    IdentityListResponse:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: '#/components/schemas/ComposeIdentity' }
    IdentityResponse:
      type: object
      required: [identity]
      properties:
        identity: { $ref: '#/components/schemas/ComposeIdentity' }
    CreateIdentityRequest:
      type: object
      required: [emailAddress]
      properties:
        name:
          type: string
          maxLength: 100
          default: ''
          description: Single line (line breaks/tabs become spaces), trimmed.
        emailAddress:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased; unique per account.
        signature:
          type: [string, 'null']
          maxLength: 10000
          description: Line endings normalized, trailing whitespace removed; empty = null.
    UpdateIdentityRequest:
      type: object
      minProperties: 1
      description: At least one of the fields is required.
      properties:
        name:
          type: string
          maxLength: 100
          description: Single line (line breaks/tabs become spaces), trimmed.
        signature:
          type: [string, 'null']
          maxLength: 10000
          description: Line endings normalized, trailing whitespace removed; empty = null.
        isDefault:
          type: boolean
          const: true
          description: Makes this identity the account default; `false` is rejected.

    # --- folders ----------------------------------------------------------
    FolderRole:
      type: string
      enum: [sent, drafts, trash, archive, junk]
    FolderSummary:
      type: object
      description: One folder in tree pre-order; `depth` 0 = top level.
      required:
        - id
        - name
        - path
        - delimiter
        - parentId
        - depth
        - specialUse
        - specialUseOverride
        - selectable
        - unreadCount
        - total
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Last path segment. }
        path: { type: string, description: Full IMAP path. }
        delimiter: { type: [string, 'null'] }
        parentId: { type: [string, 'null'], format: uuid }
        depth: { type: integer, minimum: 0 }
        specialUse:
          type: [string, 'null']
          enum: [inbox, sent, drafts, trash, archive, junk, null]
          description: Effective role (detected or overridden); `inbox` for INBOX.
        specialUseOverride:
          description: Manually assigned role; null = automatic detection.
          oneOf:
            - $ref: '#/components/schemas/FolderRole'
            - type: 'null'
        selectable:
          type: boolean
          description: false for containers without messages (IMAP \Noselect).
        unreadCount: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    FolderListResponse:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/FolderSummary' }
    UpdateFolderRequest:
      type: object
      required: [specialUse]
      properties:
        specialUse:
          description: Role to assign; null returns the folder to automatic detection.
          oneOf:
            - $ref: '#/components/schemas/FolderRole'
            - type: 'null'
    LoadOlderResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: false when such a job was already queued or running.

    # --- messages ---------------------------------------------------------
    MailPerson:
      type: object
      required: [name, address]
      properties:
        name: { type: string, description: May be empty. }
        address: { type: string }
    MessageFlags:
      type: object
      required: [seen, flagged, answered]
      properties:
        seen: { type: boolean }
        flagged: { type: boolean }
        answered: { type: boolean }
    MessageListItem:
      type: object
      required: [id, subject, from, date, snippet, flags, hasAttachments, threadId, threadCount]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        from:
          oneOf:
            - $ref: '#/components/schemas/MailPerson'
            - type: 'null'
        date:
          type: string
          format: date-time
          description: Date header, falling back to arrival time.
        snippet: { type: string }
        flags: { $ref: '#/components/schemas/MessageFlags' }
        hasAttachments: { type: boolean }
        threadId:
          type: [string, 'null']
          format: uuid
          description: Conversation; null until the worker has threaded the message.
        threadCount:
          type: integer
          minimum: 1
          description: Messages in the conversation across all folders of the account.
    MessageListResponse:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/MessageListItem' }
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page; null on the last page.
    UnifiedMessageListItem:
      allOf:
        - $ref: '#/components/schemas/MessageListItem'
        - type: object
          required: [accountId, folderId]
          properties:
            accountId: { type: string, format: uuid }
            folderId:
              type: string
              format: uuid
              description: INBOX folder of the account.
    UnifiedMessageListResponse:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/UnifiedMessageListItem' }
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page; null on the last page.
    MessageDetail:
      type: object
      required:
        - id
        - accountId
        - folderIds
        - subject
        - from
        - to
        - cc
        - replyTo
        - deliveredTo
        - date
        - flags
        - hasAttachments
        - messageId
        - references
        - text
        - threadId
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        folderIds:
          type: array
          items: { type: string, format: uuid }
        subject: { type: string }
        from:
          oneOf:
            - $ref: '#/components/schemas/MailPerson'
            - type: 'null'
        to:
          type: array
          items: { $ref: '#/components/schemas/MailPerson' }
        cc:
          type: array
          items: { $ref: '#/components/schemas/MailPerson' }
        replyTo:
          type: array
          items: { $ref: '#/components/schemas/MailPerson' }
          description: Empty when the message has no Reply-To.
        deliveredTo:
          type: array
          items: { type: string }
          description: Envelope recipients (Delivered-To/X-Original-To, lower case).
        date: { type: string, format: date-time }
        flags: { $ref: '#/components/schemas/MessageFlags' }
        hasAttachments: { type: boolean }
        messageId:
          type: [string, 'null']
          description: Message-ID header in angle brackets; null when the message has none.
        references:
          type: array
          items: { type: string }
          description: References header (Message-IDs, oldest first).
        text:
          type: [string, 'null']
          description: Plain-text body; null while not downloaded yet.
        threadId: { type: [string, 'null'], format: uuid }
    ThreadDetail:
      type: object
      required: [id, accountId, subject, messages]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        subject:
          type: string
          description: Subject of the newest message.
        messages:
          type: array
          description: Oldest first (newest 200).
          items: { $ref: '#/components/schemas/MessageDetail' }
    MessageAction:
      type: string
      enum: [read, unread, flag, unflag, archive, delete, move]
    MessageActionRequest:
      type: object
      required: [folderId, messageIds, action]
      properties:
        folderId:
          type: string
          format: uuid
          description: Folder the messages are in (the listed folder).
        messageIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: Duplicates are ignored.
        action: { $ref: '#/components/schemas/MessageAction' }
        targetFolderId:
          type: string
          format: uuid
          description: Required for `move`; selectable folder of the same account. Ignored otherwise.
    MessageActionResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0
          description: Number of message locations changed locally (write-back is queued).
    MessageHtmlResponse:
      type: object
      required: [html, remoteContentBlocked]
      properties:
        html:
          type: [string, 'null']
          description: Sanitized HTML; null when there is no HTML part or the body is not synced (use `text`).
        remoteContentBlocked:
          type: boolean
          description: Remote images/backgrounds were removed (loadable with `remote=1`).
    MessageAttachment:
      type: object
      required: [index, filename, contentType, size, inline]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position among the attachments (download path parameter).
        filename:
          type: string
          maxLength: 255
          description: Decoded, sanitized file name; `anhang-N` when the mail has none.
        contentType:
          type: string
          description: Declared MIME type (lower case, not trusted for display).
        size:
          type: integer
          minimum: 0
          description: Decoded size in bytes.
        inline:
          type: boolean
          description: Referenced from the HTML body (cid:).
    MessageAttachmentListResponse:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MessageAttachment' }

    # --- search -----------------------------------------------------------
    SearchResultItem:
      allOf:
        - $ref: '#/components/schemas/MessageListItem'
        - type: object
          required: [folderId]
          properties:
            folderId:
              type: string
              format: uuid
              description: Folder the message was found in.
    SearchResponse:
      type: object
      required: [messages, providerMatches, notSynced, truncated, foldersSearched, foldersFailed]
      properties:
        messages:
          type: array
          maxItems: 100
          description: Locally stored matches, newest first; each message once.
          items: { $ref: '#/components/schemas/SearchResultItem' }
        providerMatches:
          type: integer
          minimum: 0
          description: All matches the provider reported in the searched folders.
        notSynced:
          type: integer
          minimum: 0
          description: Matches without a local copy (not synced or outside the sync window).
        truncated:
          type: boolean
          description: More local matches than returned, or too many provider matches to map.
        foldersSearched: { type: integer, minimum: 0 }
        foldersFailed:
          type: integer
          minimum: 0
          description: Folders that could not be searched.
    SearchProviderError:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code:
          type: string
          enum: [AUTH_FAILED, BLOCKED_HOST, BLOCKED_PORT, TIMEOUT, TLS_REQUIRED, UNREACHABLE]
