          description: Longer values are truncated; empty becomes `Browser`.
        platform:
          type: string
          enum:
            - ios_pwa
            - android_pwa
            - desktop
          default: desktop
          description: Unknown values are treated as `desktop`.
    SetupRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          required:
            - setupCode
          properties:
            setupCode:
              type: string
              maxLength: 200
              description: Case-insensitive; spaces and dashes are ignored.
    AuthSessionResponse:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 10
          maxLength: 200
    DeviceInfo:
      type: object
      required:
        - id
        - name
        - platform
        - lastSeenAt
        - isCurrent
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum:
            - ios_pwa
            - android_pwa
            - desktop
        lastSeenAt:
          type:
            - string
            - "null"
          format: date-time
        isCurrent:
          type: boolean
          description: The device making the request.
    DeviceListResponse:
      type: object
      required:
        - devices
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInfo"
    UserSettings:
      type: object
      required:
        - unifiedInbox
      properties:
        unifiedInbox:
