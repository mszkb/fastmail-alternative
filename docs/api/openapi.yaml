            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: 465 = implicit TLS, else STARTTLS
            user:
              type: string
              description: Empty or missing = IMAP user.
            password:
              type: string
              writeOnly: true
              description: Empty or missing = IMAP password.
        syncSince:
          type:
            - string
            - "null"
          format: date
          description: "`YYYY-MM-DD` between 1970-01-01 and today (UTC, one day slack); null/missing = all messages."
    UpdateAccountRequest:
      type: object
      description: Every field optional; an empty object changes nothing.
      properties:
        displayName:
          type: string
          minLength: 1
          description: Trimmed and cut to 100 characters; must not be empty after trimming.
        sortOrder:
          type: integer
          minimum: -1000000
          maximum: 1000000
        syncSince:
          type:
            - string
            - "null"
          format: date
