# Generated from docs/api/parts/*.yaml by packages/contract-tests/scripts/build-openapi.mjs - edit the parts.
openapi: 3.1.0
info:
  title: fastmail-alternative API
  version: 0.0.0
  description: |
    HTTP API of the self-hosted multi-account mail client (ADR-0010,
    ADR-0013). Contract between the PWA (`apps/web`) and the backend
    (`apps/server-php`). All routes live under `/api`. Authentication is a server-side session in the HttpOnly,
    SameSite=Strict cookie `fma_session` (ADR-0004). State-changing
    requests from browsers must be same-origin (`Sec-Fetch-Site` or
    `Origin`), otherwise 403. Rate limits answer 429 with `Retry-After`.
  license:
    name: ISC
servers:
  - url: /
security:
  - session: []
tags:
  - name: system
  - name: auth
  - name: settings
  - name: accounts
  - name: identities
  - name: folders
  - name: messages
  - name: compose
  - name: push
  - name: storage
  - name: config
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fma_session
    metricsToken:
      type: http
      scheme: bearer
      description: "`METRICS_TOKEN` from the server configuration"
  schemas:
    ErrorMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable text; never contains mail contents or credentials.
    AccountStatus:
      type: string
      enum:
        - ok
        - auth_error
        - unreachable
        - disabled
      description: "`auth_error` waits for new credentials; `unreachable` retries with backoff."
    AccountErrorCode:
      type: string
      enum:
        - AUTH_FAILED
        - HOST_NOT_FOUND
        - CONNECTION_REFUSED
        - CONNECTION_LOST
        - TIMEOUT
        - TLS_ERROR
        - TLS_REQUIRED
        - BLOCKED_HOST
        - BLOCKED_PORT
        - JOB_TIMEOUT
        - CREDENTIALS_REQUIRED
        - RATE_LIMITED
        - OAUTH_EXPIRED
        - OAUTH_NOT_CONFIGURED
    HostPort:
      type: object
      required:
        - host
        - port
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
    AccountSummary:
      type: object
      description: One mail account; never includes credentials or keys.
      required:
        - id
        - displayName
        - emailAddress
        - imap
        - smtp
        - status
        - lastErrorCode
        - nextRetryAt
        - capabilities
        - sortOrder
        - lastSyncAt
        - syncSince
        - unreadCount
        - syncing
        - credentialKind
        - oauthProvider
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emailAddress:
          type: string
          format: email
        imap:
          $ref: "#/components/schemas/HostPort"
        smtp:
          $ref: "#/components/schemas/HostPort"
        status:
          $ref: "#/components/schemas/AccountStatus"
        lastErrorCode:
          description: Last connection error (machine code only); null when healthy.
          oneOf:
            - $ref: "#/components/schemas/AccountErrorCode"
            - type: "null"
        nextRetryAt:
          type:
            - string
            - "null"
          format: date-time
          description: Next automatic connection attempt while the circuit is open.
        capabilities:
          type: array
          items:
            type: string
          description: IMAP capabilities (e.g. IDLE, CONDSTORE).
        sortOrder:
          type: integer
        lastSyncAt:
          type:
            - string
            - "null"
          format: date-time
        syncSince:
          type:
            - string
            - "null"
          format: date
          description: Sync only messages received on or after this day; null = no limit.
        unreadCount:
          type: integer
          minimum: 0
          description: Unread messages in the INBOX (0 in create/update responses).
        syncing:
          type: boolean
          description: A sync is queued or running (false in create/update responses).
        credentialKind:
          type: string
          enum:
            - password
            - oauth2
          description: "`oauth2`: sign-in with Google/Microsoft; new sign-in via POST /api/oauth/{provider}/start with `accountId`."
        oauthProvider:
          description: Provider of an `oauth2` account; null for password accounts.
          oneOf:
            - $ref: "#/components/schemas/OAuthProvider"
            - type: "null"
    AccountListResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
    MailHost:
      type: string
      maxLength: 253
      description: DNS hostname or IP literal (no scheme, port or path); normalized to lower case.
    CreateAccountRequest:
      type: object
      required:
        - emailAddress
        - imap
        - smtp
      properties:
        displayName:
          type: string
          description: Trimmed and cut to 100 characters; defaults to the email address.
        emailAddress:
