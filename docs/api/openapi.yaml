        smtp:
          $ref: "#/components/schemas/ConnectionTestResult"
    CreateAccountResponse:
      type: object
      required:
        - account
        - test
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        test:
          $ref: "#/components/schemas/ConnectionTestPair"
    UpdateAccountResponse:
      type: object
      required:
        - account
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        test:
          $ref: "#/components/schemas/ConnectionTestPair"
          description: Present only when IMAP/SMTP data was changed and re-tested.
    AccountConnectionTestFailure:
      type: object
      required:
        - stage
        - test
      properties:
        stage:
          type: string
          enum:
            - imap
            - smtp
          description: Which test failed (SMTP is only tested after IMAP succeeded).
        test:
          $ref: "#/components/schemas/ConnectionTestResult"
    ComposeIdentity:
      type: object
      required:
        - id
        - name
        - emailAddress
        - signature
        - isDefault
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: May be empty.
        emailAddress:
          type: string
          format: email
        signature:
          type:
            - string
            - "null"
          description: Plain-text signature without the "-- " delimiter; null = none.
        isDefault:
          type: boolean
          description: Default identity of the account.
    IdentityListResponse:
      type: object
      required:
        - identities
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/ComposeIdentity"
    IdentityResponse:
      type: object
      required:
        - identity
      properties:
        identity:
          $ref: "#/components/schemas/ComposeIdentity"
    CreateIdentityRequest:
      type: object
      required:
        - emailAddress
      properties:
        name:
          type: string
          maxLength: 100
          default: ""
          description: Single line (line breaks/tabs become spaces), trimmed.
        emailAddress:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased; unique per account.
        signature:
          type:
            - string
            - "null"
          maxLength: 10000
          description: Line endings normalized, trailing whitespace removed; empty = null.
    UpdateIdentityRequest:
      type: object
      minProperties: 1
      description: At least one of the fields is required.
      properties:
        name:
          type: string
          maxLength: 100
          description: Single line (line breaks/tabs become spaces), trimmed.
        signature:
          type:
            - string
            - "null"
          maxLength: 10000
          description: Line endings normalized, trailing whitespace removed; empty = null.
        isDefault:
          type: boolean
          const: true
          description: Makes this identity the account default; `false` is rejected.
    FolderRole:
      type: string
      enum:
        - sent
        - drafts
        - trash
        - archive
        - junk
    FolderSummary:
      type: object
      description: One folder in tree pre-order; `depth` 0 = top level.
      required:
        - id
        - name
        - path
        - delimiter
        - parentId
        - depth
