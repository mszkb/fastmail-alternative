        user:
          type:
            - string
            - "null"
          description: Trimmed and cut to 320 characters.
        password:
          type:
            - string
            - "null"
          writeOnly: true
    ConnectionTestResult:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        code:
          type: string
          description: Error code on failure.
          enum:
