      required:
        - endpoint
        - keys
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: https URL on a public host, without credentials.
        keys:
          type: object
          required:
            - p256dh
            - auth
          properties:
            p256dh:
              type: string
              pattern: ^[A-Za-z0-9_-]+=*$
              description: Base64url uncompressed P-256 public key (65 bytes, leading 0x04).
            auth:
              type: string
              pattern: ^[A-Za-z0-9_-]+=*$
              description: Base64url auth secret (16 bytes).
    PushSubscriptionCreated:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    PushUnsubscribeRequest:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Endpoint of the subscription to remove.
    PushSubscriptionInfo:
      type: object
      required:
        - id
        - deviceId
        - deviceName
        - platform
        - isCurrentDevice
        - pushService
        - createdAt
        - lastSuccessAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          type: string
          enum:
            - ios_pwa
            - android_pwa
            - desktop
        isCurrentDevice:
          type: boolean
        pushService:
          type: string
          description: Host of the push service (e.g. web.push.apple.com), display only.
        createdAt:
          type: string
          format: date-time
        lastSuccessAt:
          type:
            - string
            - "null"
          format: date-time
    PushSubscriptionListResponse:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscriptionInfo"
    AccountStorage:
      type: object
      required:
        - accountId
        - messageCount
        - storedMessageCount
        - messageBytes
        - uploadCount
        - uploadBytes
        - totalBytes
      properties:
        accountId:
          type: string
          format: uuid
        messageCount:
          type: integer
          minimum: 0
          description: All synced messages (with or without stored body).
        storedMessageCount:
          type: integer
          minimum: 0
          description: Messages whose encrypted raw source is stored.
        messageBytes:
          type: integer
          minimum: 0
          description: Approximate bytes of stored raw messages (provider size).
        uploadCount:
          type: integer
          minimum: 0
          description: Pending uploads (compose, drafts, outbox).
        uploadBytes:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
          description: messageBytes + uploadBytes
    StorageResponse:
      type: object
      required:
        - accounts
        - totalBytes
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountStorage"
        totalBytes:
          type: integer
          minimum: 0
    ConfigServer:
      type: object
      description: Host, port and user name only - never a password.
      required:
        - host
        - port
        - user
      properties:
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        user:
          type: string
          maxLength: 320
    ConfigFolderMapping:
      type: object
      required:
        - path
        - delimiter
      properties:
        path:
          type: string
          maxLength: 1000
          description: IMAP path; must not be INBOX.
        delimiter:
          type:
            - string
            - "null"
          maxLength: 4
    ConfigFolderRoles:
      type: object
      description: Manual folder mapping, role -> IMAP folder.
      additionalProperties: false
      properties:
        sent:
          $ref: "#/components/schemas/ConfigFolderMapping"
        drafts:
          $ref: "#/components/schemas/ConfigFolderMapping"
        trash:
          $ref: "#/components/schemas/ConfigFolderMapping"
        archive:
          $ref: "#/components/schemas/ConfigFolderMapping"
        junk:
          $ref: "#/components/schemas/ConfigFolderMapping"
    ConfigExportIdentity:
      type: object
      required:
        - name
        - emailAddress
        - signature
        - isDefault
      properties:
        name:
          type: string
          maxLength: 100
        emailAddress:
          type: string
          format: email
          maxLength: 254
        signature:
          type:
            - string
            - "null"
          maxLength: 10000
        isDefault:
          type: boolean
    ConfigExportAccount:
      type: object
      required:
        - displayName
        - emailAddress
        - sortOrder
        - credentialKind
        - syncSince
        - imap
        - smtp
        - identities
        - folderRoles
      properties:
        displayName:
          type: string
          maxLength: 100
        emailAddress:
          type: string
          format: email
          maxLength: 254
        sortOrder:
          type: integer
          minimum: -1000000
          maximum: 1000000
        credentialKind:
          type: string
          enum:
            - password
            - oauth2
        oauthProvider:
          description: Provider of an `oauth2` account (the export always sets it). An imported `oauth2` account without a known provider becomes a password account; with one it waits for a new sign-in (`OAUTH_EXPIRED`).
          oneOf:
            - $ref: "#/components/schemas/OAuthProvider"
            - type: "null"
        syncSince:
          type:
            - string
            - "null"
          format: date-time
          description: Initial sync limit; null = everything.
        imap:
          $ref: "#/components/schemas/ConfigServer"
        smtp:
          $ref: "#/components/schemas/ConfigServer"
        identities:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConfigExportIdentity"
        folderRoles:
          $ref: "#/components/schemas/ConfigFolderRoles"
    ConfigExport:
      type: object
      required:
        - format
        - version
        - exportedAt
        - accounts
        - settings
      properties:
        format:
          type: string
          const: fma-config
        version:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConfigExportAccount"
        settings:
          type: object
          additionalProperties: false
          description: Reserved for server-side user settings (none yet).
    ConfigImportRequest:
      type: object
      description: |
        A file from GET /api/export/config. Validation is lenient: only the
        fields listed as required must be present; missing optional fields
        get defaults (displayName = emailAddress, sortOrder 0, credentialKind
        `password`, smtp.user = imap.user). `exportedAt` and `settings` are
        ignored. IMAP/SMTP ports must be allowed by the server
        (`MAIL_EXTRA_PORTS`).
      required:
        - format
        - version
        - accounts
      properties:
        format:
          type: string
          const: fma-config
        version:
          type: integer
          minimum: 1
          maximum: 1
          description: Versions up to the current one are accepted.
        exportedAt:
          type: string
        accounts:
          type: array
          maxItems: 20
          items:
            type: object
            required:
              - emailAddress
              - imap
              - smtp
            properties:
              displayName:
                type: string
                maxLength: 100
              emailAddress:
                type: string
                format: email
                maxLength: 254
              sortOrder:
                type: integer
                description: Clamped to +-1000000.
              credentialKind:
                type: string
                enum:
                  - password
                  - oauth2
              syncSince:
                type:
                  - string
                  - "null"
                format: date-time
              imap:
                allOf:
                  - $ref: "#/components/schemas/ConfigServer"
                  - properties:
                      user:
                        minLength: 1
              smtp:
                type: object
                required:
                  - host
                  - port
                properties:
                  host:
                    type: string
                    maxLength: 253
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  user:
                    type: string
                    maxLength: 320
              identities:
                type: array
                maxItems: 20
                items:
                  type: object
                  required:
                    - emailAddress
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    emailAddress:
                      type: string
                      format: email
                      maxLength: 254
                    signature:
                      type:
                        - string
                        - "null"
                      maxLength: 10000
                    isDefault:
                      type: boolean
              folderRoles:
                $ref: "#/components/schemas/ConfigFolderRoles"
        settings:
          type: object
    ConfigImportResponse:
      type: object
      required:
        - imported
        - skipped
      properties:
        imported:
          type: array
          description: Email addresses of created accounts; all need their password before the first sync.
          items:
            type: string
            format: email
        skipped:
          type: array
          description: Email addresses skipped because an account with them already exists.
          items:
            type: string
            format: email
    SyncSkipReason:
      type: string
      enum:
        - disabled
        - auth_error
        - backoff
        - pending
        - rate_limited
    SyncRequestResult:
      type: object
      required:
        - accountId
        - queued
        - reason
      properties:
        accountId:
          type: string
          format: uuid
        queued:
          type: boolean
        reason:
          description: Why no job was enqueued; null when queued.
          oneOf:
            - $ref: "#/components/schemas/SyncSkipReason"
            - type: "null"
    SyncAllResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/SyncRequestResult"
    AutoconfigServer:
      type: object
      additionalProperties: false
      required:
        - host
        - port
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
    AutoconfigResponse:
      type: object
      additionalProperties: false
      required:
        - found
      properties:
        found:
          type: boolean
        source:
          type: string
          enum:
            - autoconfig
            - well-known
            - ispdb
            - srv
            - mx
        imap:
          $ref: "#/components/schemas/AutoconfigServer"
        smtp:
          oneOf:
            - $ref: "#/components/schemas/AutoconfigServer"
            - type: "null"
        username:
          type: string
          enum:
            - address
            - localpart
          description: User name the provider expects - the full address or the part before the `@`.
    SendRecipient:
      description: A recipient of `POST /api/outbox`, either a plain address or `{ name, address }`.
      oneOf:
        - type: string
          format: email
          maxLength: 320
        - type: object
          required:
            - address
          properties:
            name:
              type: string
              maxLength: 200
              description: Line breaks are replaced by spaces; trimmed.
            address:
              type: string
              format: email
              maxLength: 320
    MessageIdHeader:
      type: string
      description: Message-ID in angle brackets, e.g. `<abc@example.com>`.
      maxLength: 250
      pattern: ^<[^\s<>@]+@[^\s<>@]+>$
    SendMessageRequest:
      type: object
      description: |
        At least one recipient in `to`, `cc` or `bcc` is required, at most
        100 in total.
      required:
        - accountId
        - subject
        - text
      properties:
        accountId:
          type: string
          format: uuid
        identityId:
          type: string
          format: uuid
          description: Sender identity; defaults to the account's default identity.
        to:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/SendRecipient"
        subject:
          type: string
          maxLength: 998
          description: Line breaks are replaced by spaces; trimmed.
        text:
          type: string
          maxLength: 500000
          description: Plain-text body.
        inReplyTo:
          $ref: "#/components/schemas/MessageIdHeader"
        references:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessageIdHeader"
        clientId:
          type: string
          format: uuid
          description: Client-generated id that makes the request idempotent.
        draftId:
          type: string
          format: uuid
          description: Draft to delete with the send; unknown ids are ignored.
        attachmentIds:
          type: array
          maxItems: 20
          description: Uploads of the same account, in order; duplicates are ignored.
          items:
            type: string
            format: uuid
    OutboxStatus:
      type: string
      enum:
        - queued
        - sending
        - sent
        - failed
    SentCopyStatus:
      type: string
      description: Copy in the "Sent" folder.
      enum:
        - pending
        - done
        - skipped
        - failed
    OutboxErrorCode:
      type: string
      enum:
        - AUTH_FAILED
        - SMTP_REJECTED
        - SMTP_TEMPORARY
        - HOST_NOT_FOUND
        - BLOCKED_HOST
        - BLOCKED_PORT
        - CONNECTION_REFUSED
        - TIMEOUT
        - TLS_ERROR
        - TLS_REQUIRED
        - ATTACHMENT_MISSING
        - UNKNOWN
    OutboxMessage:
      type: object
      required:
        - id
        - accountId
        - identityId
        - status
        - subject
        - from
        - to
        - cc
        - bcc
        - messageId
        - attempts
        - error
        - sentCopy
        - createdAt
        - sentAt
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        identityId:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/OutboxStatus"
        subject:
          type:
            - string
            - "null"
          description: Null once the content is no longer stored (or cannot be decrypted).
        from:
          oneOf:
            - $ref: "#/components/schemas/MailPerson"
            - type: "null"
        to:
          type: array
          items:
            $ref: "#/components/schemas/MailPerson"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/MailPerson"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/MailPerson"
        messageId:
          type: string
          description: Message-ID header (angle brackets), generated at submission.
        attempts:
          type: integer
          minimum: 0
        error:
          description: Last error (also while a retry is pending); null after success.
          oneOf:
            - type: object
              required:
                - code
                - message
              properties:
                code:
                  $ref: "#/components/schemas/OutboxErrorCode"
                message:
                  type: string
                  description: German text for the code.
            - type: "null"
        sentCopy:
          oneOf:
            - $ref: "#/components/schemas/SentCopyStatus"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        sentAt:
          type:
            - string
            - "null"
          format: date-time
    OutboxListResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OutboxMessage"
    AttachmentMissingResponse:
      type: object
      required:
        - code
        - message
        - missingIds
      properties:
        code:
          type: string
          const: ATTACHMENT_MISSING
        message:
          type: string
        missingIds:
          type: array
          description: Requested upload ids that were not found.
          items:
            type: string
            format: uuid
    SaveDraftRequest:
      type: object
      required:
        - accountId
        - subject
        - text
      properties:
        accountId:
          type: string
          format: uuid
        identityId:
          type:
            - string
            - "null"
          format: uuid
        to:
          type: string
          maxLength: 20000
          description: Address field as typed (may be incomplete); default empty.
        cc:
          type: string
          maxLength: 20000
        bcc:
          type: string
          maxLength: 20000
        subject:
          type: string
          maxLength: 998
          description: Line breaks are replaced by spaces.
        text:
          type: string
          maxLength: 500000
        inReplyTo:
          oneOf:
            - $ref: "#/components/schemas/MessageIdHeader"
            - type: "null"
        references:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessageIdHeader"
        baseVersion:
          type: integer
          minimum: 0
          description: Version the client edited; missing or 0 for a new draft.
        force:
          type: boolean
          description: Overwrite even if the draft changed elsewhere (last write wins).
        attachmentIds:
          type: array
          maxItems: 20
          description: |
            Complete list of uploads kept with the draft; uploads missing
            here are released. Omitted = attachments unchanged. Unknown or
            foreign ids are ignored.
          items:
            type: string
            format: uuid
    UploadedAttachment:
      type: object
      required:
        - id
        - filename
        - contentType
        - size
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        contentType:
          type: string
        size:
          type: integer
          minimum: 0
          description: Bytes.
    Draft:
      type: object
      required:
        - id
        - accountId
        - identityId
        - to
        - cc
        - bcc
        - subject
        - text
        - inReplyTo
        - references
        - version
        - createdAt
        - updatedAt
        - messageIds
        - attachments
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        identityId:
          type:
            - string
            - "null"
          format: uuid
        to:
          type: string
        cc:
          type: string
        bcc:
          type: string
        subject:
          type: string
        text:
          type: string
        inReplyTo:
          type:
            - string
            - "null"
        references:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageIds:
          type: array
          description: Local message ids of the draft's copy in the IMAP Drafts folder.
          items:
            type: string
            format: uuid
        attachments:
          type: array
          description: Uploads kept with the draft, in upload order.
          items:
            $ref: "#/components/schemas/UploadedAttachment"
        attachmentsSkipped:
          type: integer
          minimum: 1
          description: Only when `POST /api/messages/{id}/draft` created the draft and not all attachments could be copied.
    DraftListResponse:
      type: object
      required:
        - drafts
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
    DraftConflictResponse:
      type: object
      required:
        - message
        - draft
      properties:
        message:
          type: string
        draft:
          $ref: "#/components/schemas/Draft"
    CopyAttachmentsRequest:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid
          description: Account that receives the uploads.
        includeInline:
          type: boolean
          default: false
          description: Also copy inline raster images (png/jpeg/gif/webp).
    CopyAttachmentsResponse:
      type: object
      required:
        - attachments
        - skipped
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/UploadedAttachment"
        skipped:
          type: integer
          minimum: 0
          description: Attachments not copied (size, count or pending limits).
    OAuthProvider:
      type: string
      enum:
        - google
        - microsoft
    OAuthProvidersResponse:
      type: object
      required:
        - providers
        - redirectUri
      properties:
        providers:
          type: object
          required:
            - google
            - microsoft
          properties:
            google:
              type: boolean
            microsoft:
              type: boolean
        redirectUri:
          type:
            - string
            - "null"
    OAuthStartRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: Sign in again for this existing account.
    OAuthStartResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    OAuthStartConflict:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - NOT_CONFIGURED
            - NO_PUBLIC_URL
    GlobalSearchItem:
      type: object
      description: |
        One hit of the global search. With a local copy (`synced: true`) a
        message list item; without one (`synced: false`, `id: null`) the
        list headers fetched from the provider for this page (not stored).
      required:
        - id
        - accountId
        - folderId
        - uid
        - synced
        - subject
        - from
        - date
        - snippet
        - flags
        - hasAttachments
        - threadId
        - threadCount
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        accountId:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
          description: Folder the message was found in; actions run there.
        uid:
          type: integer
          minimum: 1
        synced:
          type: boolean
        subject:
          type: string
        from:
          oneOf:
            - $ref: "#/components/schemas/MailPerson"
            - type: "null"
        date:
          type: string
          format: date-time
        snippet:
          type: string
          description: Empty for hits without a local copy.
        flags:
          $ref: "#/components/schemas/MessageFlags"
        hasAttachments:
          type: boolean
        threadId:
          type:
            - string
            - "null"
          format: uuid
        threadCount:
          type: integer
          minimum: 1
    GlobalSearchAccount:
      type: object
      required:
        - accountId
        - status
        - matches
        - foldersSearched
        - foldersFailed
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ok
            - timeout
            - error
            - auth_error
            - rate_limited
          description: |
            `auth_error`: the account has an authentication error (provider not
            contacted) or the provider rejected the credentials;
            `rate_limited`: more than 10 provider searches of this account in
            the last minute; `error`: provider unreachable, blocked or the
            account is disabled (see `code`).
        code:
          type: string
          description: Stable error code when `status` is not `ok`.
        matches:
          type: integer
          minimum: 0
          description: Matches reported by the provider (a message in several folders counts per folder).
        foldersSearched:
          type: integer
          minimum: 0
        foldersFailed:
          type: integer
          minimum: 0
    GlobalSearchResponse:
      type: object
      required:
        - messages
        - accounts
        - total
        - nextCursor
      properties:
        messages:
          type: array
          maxItems: 100
          description: Hits of this page, newest first across accounts and folders.
          items:
            $ref: "#/components/schemas/GlobalSearchItem"
        accounts:
          type: array
          description: One entry per searched account, in account order.
          items:
            $ref: "#/components/schemas/GlobalSearchAccount"
        total:
          type: integer
          minimum: 0
          description: Sum of `matches` (approximate total).
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque cursor of the next page; null on the last page.
    SyncState:
      type: string
      description: |
        `idle` nothing to do; `queued` a sync waits for the worker;
        `running` a sync runs (progress fields set); `cancelling` a stop was
        requested and the running sync ends after its current message;
        `error` the provider was unreachable (backoff until `nextRunAt`);
        `auth_error` new credentials needed; `paused` the account is
        disabled.
      enum:
        - idle
        - queued
        - running
        - cancelling
        - error
        - auth_error
        - paused
    SyncPhase:
      type: string
      description: |
        `folders` listing the mailboxes (done/total = mailboxes); `flags`
        listing UIDs and flags of a folder; `expunge` removing vanished
        messages; `headers` fetching new messages incl. their bodies
        (done/total = messages); `bodies` bodies missing from earlier runs.
      enum:
        - folders
        - headers
        - bodies
        - flags
        - expunge
    AccountSyncStatus:
      type: object
      required:
        - accountId
        - state
        - phase
        - folderId
        - done
        - total
        - startedAt
        - updatedAt
        - queuedJobs
        - lastSyncAt
        - nextRunAt
        - lastErrorCode
      properties:
        accountId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/SyncState"
        phase:
          description: Phase of the running sync; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/SyncPhase"
            - type: "null"
        folderId:
          description: Folder the running sync works on (resolve the name via the folder list); null in phase `folders`.
          type:
            - string
            - "null"
          format: uuid
        done:
          type:
            - integer
            - "null"
          minimum: 0
        total:
          type:
            - integer
            - "null"
          minimum: 0
        startedAt:
          description: Start of the running job.
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          description: Last progress write (at most every ~2 s).
          type:
            - string
            - "null"
          format: date-time
        queuedJobs:
          description: Sync jobs of the account waiting to run (e.g. one per folder).
          type: integer
          minimum: 0
        lastSyncAt:
          description: Last successful sync.
          type:
            - string
            - "null"
          format: date-time
        nextRunAt:
          description: Earliest next run (scheduler, queued job or end of the backoff); null while running or when the account needs action.
          type:
            - string
            - "null"
          format: date-time
        lastErrorCode:
          description: Error code of the last failed connection (e.g. `AUTH_FAILED`, `TIMEOUT`), never a provider message.
          type:
            - string
            - "null"
    SyncStatusResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountSyncStatus"
    SyncCancelResult:
      type: object
      required:
        - accountId
        - cancelledQueued
        - cancelling
      properties:
        accountId:
          type: string
          format: uuid
        cancelledQueued:
          description: Waiting sync jobs that were cancelled.
          type: integer
          minimum: 0
        cancelling:
          description: A running sync was asked to stop.
          type: boolean
    SyncCancelAllResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/SyncCancelResult"
    ThemeFile:
      type: object
      description: A theme file; the full rules are in docs/themes/schema.json.
      required:
        - format
        - id
        - name
        - version
        - author
        - license
        - minAppVersion
      properties:
        format:
          const: 1
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,47}$
        name:
          type: string
          maxLength: 60
        version:
          type: string
        author:
          type: string
          maxLength: 100
        license:
          type: string
          maxLength: 60
        minAppVersion:
          type: string
        description:
          type: string
          maxLength: 300
        colors:
          type: object
        sizes:
          type: object
        layout:
          type: object
    InstalledTheme:
      type: object
      required:
        - id
        - name
        - version
        - installedAt
        - theme
        - warnings
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        installedAt:
          type: string
          format: date-time
        theme:
          $ref: "#/components/schemas/ThemeFile"
        warnings:
          type: array
          description: Text/background pairs below WCAG AA (4.5:1); the theme is installed anyway.
          items:
            type: string
    ThemeListResponse:
      type: object
      required:
        - themes
      properties:
        themes:
          type: array
          items:
            $ref: "#/components/schemas/InstalledTheme"
    ThemeError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: array
          description: Every problem found, German, naming the field (never the rejected value).
          items:
            type: string
  parameters:
    SearchTo:
      name: to
      in: query
      required: false
      description: Recipient (IMAP TO); trimmed, max 200 characters.
      schema:
        type: string
        maxLength: 200
    SearchUnread:
      name: unread
      in: query
      required: false
      description: Only unread messages (IMAP UNSEEN).
      schema:
        type: string
        enum:
          - "1"
          - "true"
          - "0"
          - "false"
    SearchIncludeJunk:
      name: includeJunk
      in: query
      required: false
      description: Also search Spam and Trash (left out by default). Gmail's "All Mail" is never searched.
      schema:
        type: string
        enum:
          - "1"
          - "true"
          - "0"
          - "false"
    SearchAttachment:
      name: attachment
      in: query
      required: false
      description: Only messages with attachments (Content-Type multipart/mixed; IMAP has no attachment criterion).
      schema:
        type: string
        enum:
          - "1"
          - "true"
          - "0"
          - "false"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: Not authenticated (no or expired session)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: Cross-origin request rejected (CSRF protection)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: Not found (or not owned by the current user)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: Conflict with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next attempt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
paths:
  /api/accounts:
    get:
      operationId: listAccounts
      tags:
        - accounts
      summary: List mail accounts
      description: |
        Accounts of the current user ordered by `sortOrder`, then creation
        time. Never contains credentials or keys. `unreadCount` counts unread
        messages in the INBOX; `syncing` is true while a folder/message sync
        is queued (and eligible) or running.
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAccount
      tags:
        - accounts
      summary: Add a mail account
      description: |
        Validates the input, then tests the IMAP and SMTP connection with the
        given credentials before anything is stored (broken accounts are not
        persisted). On success the credentials are stored encrypted, a
        default identity is created from the account address and an initial
        folder sync is queued. At most 20 accounts per user. Ports 993/465
        use implicit TLS, all other ports STARTTLS. Rate limit: 10 requests
        per minute and IP (`account-test`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Maximum number of accounts (20) reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "422":
          description: IMAP or SMTP connection test failed; nothing was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConnectionTestFailure"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateAccount
      tags:
        - accounts
      summary: Update a mail account
      description: |
        Every field is optional. Empty `user`/`password` strings (or null)
        mean "unchanged" - stored credentials are never sent to the client.
        When `imap` or `smtp` is given, the merged connection data is tested
        first (nothing is saved on failure); on success the error state is
        cleared and a folder sync is queued. SMTP credentials that equal the
        IMAP ones follow IMAP changes unless given explicitly. Changing
        `syncSince` also queues a folder sync; already stored older messages
        are kept. Rate limit: 10 requests per minute and IP (`account-test`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Updated account; `test` is present when the connection was re-tested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: IMAP or SMTP connection test failed; nothing was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConnectionTestFailure"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAccount
      tags:
        - accounts
      summary: Delete a mail account
      description: |
        Deletes the account with all its identities, folders, messages,
        threads, outbox entries and jobs, and its data key (crypto-shredding).
        Encrypted files in the mail-data volume are removed asynchronously by
        the worker (`account_cleanup` job).
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/accounts/{id}/drafts:
    get:
      operationId: listAccountDrafts
      tags:
        - compose
      summary: List drafts of an account
      description: Not deleted drafts, newest first (`updatedAt` desc), at most 200.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/accounts/{id}/folders:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listFolders
      tags:
        - folders
      summary: Get the folder tree of an account
      description: |
        Folders in tree pre-order (parents before children); among siblings
        INBOX first, then special-use folders, then by name. Counts are
        computed from the locally synced messages.
      responses:
        "200":
          description: Folder tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/accounts/{id}/identities:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIdentities
      tags:
        - identities
      summary: List sender identities of an account
      description: Default identity first, then by address.
      responses:
        "200":
          description: Identity list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createIdentity
      tags:
        - identities
      summary: Add a sender identity (alias)
      description: |
        Adds an alias to the account. Addresses are unique per account
        (case-insensitive). At most 20 identities per account. Whether the
        provider accepts the alias as sender is not verified. The body is
        validated before the account is looked up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "201":
          description: Identity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Address already exists for the account, or identity limit (20) reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/accounts/{id}/outbox:
    get:
      operationId: listAccountOutbox
      tags:
        - compose
      summary: List pending and failed outbox messages of an account
      description: |
        Messages with status `queued`, `sending` or `failed`, newest first
        (`createdAt` desc), at most 100.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Outbox entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/accounts/{id}/search:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: searchAccount
      tags:
        - messages
      summary: Search an account at the provider (IMAP SEARCH)
      description: |
        Runs IMAP SEARCH at the provider and maps the matching UIDs to
        locally synced messages (newest first, at most 100). Without
        `folderId`, all selectable folders except Junk/Trash (unless
        `includeJunk`) and Gmail's "All Mail" are searched (at most 100). At least one criterion (`q`, `from`, `to`,
        `subject`, `since`, `before`, `unread`, `attachment`) is required. At
        most 10 provider searches per account and minute. The query is never
        logged or stored.
      parameters:
        - name: q
          in: query
          required: false
          description: Any text in headers and body (IMAP TEXT); trimmed, max 200 characters.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: subject
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/SearchTo"
        - $ref: "#/components/parameters/SearchUnread"
        - $ref: "#/components/parameters/SearchAttachment"
        - $ref: "#/components/parameters/SearchIncludeJunk"
        - name: since
          in: query
          required: false
          description: Received on or after this day (UTC).
          schema:
            type: string
            format: date
        - name: before
          in: query
          required: false
          description: Received before this day (exclusive); must be after `since`.
          schema:
            type: string
            format: date
        - name: folderId
          in: query
          required: false
          description: Only this (selectable) folder of the account.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Search results
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Invalid or missing criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Account or folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Account has an authentication error or is disabled (provider not contacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: |
            Rate limit exceeded: more than 10 provider searches per account and
            minute (answered without `Retry-After`), or the global per-IP limit
            (with `Retry-After`).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt (global limit only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Provider unreachable, credentials rejected, host/port blocked or STARTTLS missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProviderError"
        "504":
          description: Search at the provider exceeded the 30 s deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProviderError"
  /api/accounts/{id}/storage:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAccountStorage
      tags:
        - storage
      summary: Storage usage of one account
      responses:
        "200":
          description: Usage of the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/accounts/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: syncAccount
      tags:
        - accounts
      summary: Request a sync of one account
      description: |
        Enqueues a folder sync unless the account is disabled, needs new
        credentials, is in backoff, already has a sync queued/running, or
        the last sync was requested less than 30 seconds ago.
      responses:
        "200":
          description: Nothing enqueued; `reason` says why (never `rate_limited`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRequestResult"
        "202":
          description: Folder sync enqueued for the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRequestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: |
            Last sync requested less than 30 s ago (body: SyncRequestResult
            with reason `rate_limited`, Retry-After 30), or the global rate
            limit was exceeded (body: ErrorMessage).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncRequestResult"
                  - $ref: "#/components/schemas/ErrorMessage"
  /api/accounts/{id}/sync/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelAccountSync
      tags:
        - accounts
      summary: Stop the sync of one account
      description: |
        Queued folder/message syncs of the account end at once (so the
        folder sync -> message sync chain stops); a running one stops
        cooperatively between two stored messages within a few seconds
        (`state` is `cancelling` until then). Messages stored so far stay;
        the next sync continues without duplicates. Other accounts are not
        affected. The periodic scheduler syncs the account again at its next
        regular time; a manual sync is possible right away (a stopped sync
        does not count for the 30 s limit).
      responses:
        "200":
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCancelResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/accounts/{id}/uploads:
    post:
      operationId: uploadAttachment
      tags:
        - compose
      summary: Upload one attachment file
      description: |
        The raw file is the request body (`application/octet-stream`, not
        multipart). Stored encrypted with the account DEK until sent,
        kept with a draft or removed by the cleanup. Size limit
        `MAX_ATTACHMENT_BYTES` (default 10 MiB). Account ownership and the
        concurrency limit (`MAX_CONCURRENT_UPLOADS`) are checked before the
        body is read. Rate limit rule `upload` (60/min per IP).
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: X-Filename
          in: header
          required: false
          description: |
            Percent-encoded file name. Path parts and control characters are
            removed, length capped at 255; empty -> `anhang`.
          schema:
            type: string
        - name: X-Content-Type
          in: header
          required: false
          description: MIME type of the file; invalid or missing -> `application/octet-stream`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Upload stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedAttachment"
        "400":
          description: Invalid percent-encoding in `X-Filename`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Account not found (or not owned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: File larger than `MAX_ATTACHMENT_BYTES`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "415":
          description: Body is not `application/octet-stream`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: |
            Rate limit `upload` exceeded or too many uploads in progress
            (both with `Retry-After`), or too many pending uploads of this
            account (limit 100, no `Retry-After`).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt (not sent for the pending-uploads limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/devices:
    get:
      operationId: listDevices
      tags:
        - auth
      summary: List logged-in devices
      description: Non-revoked devices; the current device comes first, then by last activity.
      responses:
        "200":
          description: Devices of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeDevice
      tags:
        - auth
      summary: Revoke a device
      description: Ends all sessions of the device and removes its push subscriptions.
      responses:
        "204":
          description: Device revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The current device cannot be revoked (log out instead)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Log in with email and password
      description: |
        Creates a new device and session. A still valid session of this
        browser is ended. After 5 failed attempts within 15 minutes the
        client IP is locked out for 15 minutes (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`fma_session=<token>; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000` (plus `Secure` unless plain HTTP)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid email or password (also for malformed input)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Login lockout or rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/password:
    post:
      operationId: changePassword
      tags:
        - auth
      summary: Change the password
      description: |
        Requires the current password (same lockout as login). Revokes all
        other devices (their sessions and push subscriptions) and rotates
        the current session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed
          headers:
            Set-Cookie:
              description: "`fma_session=<token>; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000` (plus `Secure` unless plain HTTP)"
              schema:
                type: string
        "400":
          description: New password must have 10 to 200 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current password is incorrect, or cross-origin request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Lockout after failed attempts or rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/auth/session:
    delete:
      operationId: logout
      tags:
        - auth
      summary: Log out (end the current session)
      description: |
        Deletes the session. If the device has no sessions left, its push
        subscriptions are removed as well.
      responses:
        "204":
          description: Logged out; the session cookie is cleared
          headers:
            Set-Cookie:
              description: Clears `fma_session` (expired cookie).
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/setup:
    post:
      operationId: setupUser
      tags:
        - auth
      summary: Create the single user (first run)
      description: |
        Only possible while no user exists and only with the setup code
        (`SETUP_TOKEN` or the code written to the api log). Creates the
        user, a device and a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: User created and logged in
          headers:
            Set-Cookie:
              description: "`fma_session=<token>; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000` (plus `Secure` unless plain HTTP)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid email or password (10 to 200 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Setup already completed, invalid setup code, or cross-origin request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags:
        - auth
      summary: Setup and login state
      description: |
        Public. When a valid session cookie is sent and its token is older
        than 24 h, the token is rotated and a new `fma_session` cookie is set.
      security: []
      responses:
        "200":
          description: Current state
          headers:
            Set-Cookie:
              description: Only sent when the session token was rotated; same attributes as on login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/autoconfig:
    get:
      operationId: detectMailSettings
      tags:
        - accounts
      summary: Detect IMAP/SMTP settings of an address domain
      description: |
        Pre-fill for the account form when no provider preset matches. The
        server tries, in this order (first result wins): the provider's
        autoconfig (`https://autoconfig.<domain>/mail/config-v1.1.xml`,
        then `https://<domain>/.well-known/autoconfig/mail/config-v1.1.xml`),
        the Thunderbird ISPDB (off with `AUTOCONFIG_ISPDB=0`), DNS SRV
        records (RFC 6186/8314) and the ISPDB entry of the MX host's base
        domain (`source` names the one that answered). Only the domain is
        sent - never the address or a password; https only, public hosts
        only (SSRF protection), at most ~8 s. Servers without TLS are never
        returned; implicit TLS is preferred over STARTTLS. Nothing found is
        no error (`found: false`). The connection test of
        `POST /api/accounts` confirms the values.
      parameters:
        - name: domain
          in: query
          required: true
          description: Domain part of the address, e.g. `example.org`
          schema:
            type: string
            maxLength: 253
      responses:
        "200":
          description: Detected settings, or `found` false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoconfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/drafts/{id}:
    get:
      operationId: getDraft
      tags:
        - compose
      summary: Get a draft
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveDraft
      tags:
        - compose
      summary: Create or update a draft (autosave)
      description: |
        The id is a client-generated UUID. Only a save without
        `baseVersion` (or 0) creates the draft (201); otherwise the existing
        draft is updated (200, `version` + 1). If the draft was saved
        elsewhere since `baseVersion`, the answer is 409 with the current
        draft, unless `force` is true (last write wins). A sent or
        discarded draft answers 410. Each save enqueues a delayed
        `draft_sync` job (IMAP Drafts folder). Body limit 4 MiB.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Invalid draft id, account or identity not found, or the draft
            belongs to another user/account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Draft was changed on another device since `baseVersion`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftConflictResponse"
        "410":
          description: Draft was sent or discarded meanwhile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: Request body over 4 MiB, or kept attachments together exceed `MAX_ATTACHMENTS_TOTAL_BYTES`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: |
            Too many uploads kept with drafts of this account (limit 200);
            no `Retry-After`. The global rate limit can also answer 429
            (with `Retry-After`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteDraft
      tags:
        - compose
      summary: Discard a draft
      description: |
        Idempotent: an unknown or already deleted draft also answers 204.
        Deletes the uploads kept with the draft and enqueues removal of its
        IMAP copy.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Draft discarded (or did not exist)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invalid id, or the draft belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/export/config:
    get:
      operationId: exportConfig
      tags:
        - config
      summary: Download the server configuration
      description: |
        Accounts (host, port, user name), identities, manual folder mappings
        and settings as versioned JSON. Never contains passwords, OAuth
        tokens, keys or mail content.
      responses:
        "200":
          description: Configuration file (pretty-printed JSON, served as attachment)
          headers:
            Content-Disposition:
              description: '`attachment; filename="fma-config-YYYY-MM-DD.json"`'
              schema:
                type: string
            Cache-Control:
              description: "`no-store`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/folders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateFolderRole
      tags:
        - folders
      summary: Assign or reset a folder role
      description: |
        Assigns a role (sent/drafts/trash/archive/junk) manually, or returns
        the folder to automatic detection with `specialUse: null`. A role is
        overridden on at most one folder per account (assigning it elsewhere
        moves it). Effective roles of all folders of the account are
        recomputed immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "204":
          description: Role updated
        "400":
          description: Invalid role, folder not selectable (\Noselect), or INBOX given a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/folders/{id}/load-older:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: loadOlderMessages
      tags:
        - folders
      summary: Queue loading older messages of a folder
      description: |
        Enqueues a message sync that fetches the next batch below the lowest
        synced UID (ignores the account's `syncSince`). At most one such job
        per folder is queued or running; a repeated request answers
        `queued: false`. No request body.
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadOlderResponse"
        "400":
          description: Folder cannot contain messages (\Noselect)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/folders/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listFolderMessages
      tags:
        - messages
      summary: List messages of a folder (paginated)
      description: |
        Newest first (Date header, falling back to arrival time). Keyset
        pagination: pass `nextCursor` of the previous page as `cursor`;
        stable while new mail arrives.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor (`nextCursor` of the previous page); malformed values answer 400.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size; values above 100 are clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          description: Invalid `cursor` or `limit`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Liveness/readiness check
      description: Reports `ok` only when the database is reachable.
      security: []
      responses:
        "200":
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unreachable (`status` is `degraded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/identities/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateIdentity
      tags:
        - identities
      summary: Update a sender identity
      description: |
        Changes name and/or signature, or makes the identity the account's
        default (`isDefault: true`). At least one field is required.
        `isDefault: false` is rejected - choose another identity as default
        instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIdentityRequest"
      responses:
        "200":
          description: Updated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteIdentity
      tags:
        - identities
      summary: Delete a sender identity
      description: The default identity cannot be deleted. Queued outbox messages keep their stored sender.
      responses:
        "204":
          description: Identity deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The default identity cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/import/config:
    post:
      operationId: importConfig
      tags:
        - config
      summary: Import a server configuration
      description: |
        Creates the accounts in one transaction with empty credentials:
        status `auth_error`, code `CREDENTIALS_REQUIRED`, until the password
        is entered. Accounts whose address already exists are skipped. Body
        limit 2 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigImportResponse"
        "400":
          description: Not a config file of this app, unsupported version, or invalid account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Maximum number of accounts (20) reached; nothing was imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: Body larger than 2 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMessage
      tags:
        - messages
      summary: Get message details
      description: |
        Headers, flags (union over all folders the message is in) and the
        plain-text body. Does not mark the message as read. The HTML body
        comes from `GET /api/messages/{id}/html`.
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/messages/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listMessageAttachments
      tags:
        - messages
      summary: List attachments of a received message
      description: |
        Derived on demand from the encrypted raw mail. Empty list when the
        raw source is not synced yet or cannot be parsed.
      responses:
        "200":
          description: Attachment list
          headers:
            Cache-Control:
              description: Always `no-store`
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAttachmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/messages/{id}/attachments/{index}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: index
        in: path
        required: true
        description: Attachment position as returned by the attachment list (0-based).
        schema:
          type: integer
          minimum: 0
    get:
      operationId: downloadMessageAttachment
      tags:
        - messages
      summary: Download one attachment
      description: |
        Streams the decoded attachment. Only raster images
        (png/jpeg/gif/webp/avif/bmp) and `text/plain` are served with their
        own content type and may be shown inline (`inline=1`); every other
        type is sent as `application/octet-stream` with
        `Content-Disposition: attachment`. Always sandboxed by CSP.
      parameters:
        - name: inline
          in: query
          required: false
          description: "`1` requests `Content-Disposition: inline` (only honored for inline-safe types)."
          schema:
            type: string
            enum:
              - "0"
              - "1"
      responses:
        "200":
          description: Attachment content
          headers:
            Content-Type:
              description: Declared type for inline-safe types, else `application/octet-stream`
              schema:
                type: string
            Content-Disposition:
              description: "`attachment` or `inline` with `filename` (ASCII) and `filename*` (UTF-8)"
              schema:
                type: string
            Content-Security-Policy:
              description: Always this sandbox policy
              schema:
                type: string
                const: default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Cross-Origin-Resource-Policy:
              schema:
                type: string
                const: same-origin
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            image/*:
              schema:
                type: string
                contentMediaType: image/*
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Message or attachment not found (also for an invalid index or unsynced raw mail)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/messages/{id}/attachments/copy:
    post:
      operationId: copyMessageAttachments
      tags:
        - compose
      summary: Copy a message's attachments into new uploads (forwarding)
      description: |
        Copies the attachments of the received message into new uploads of
        `accountId`. With `includeInline: true` inline raster images
        (png/jpeg/gif/webp) are copied too. Attachments beyond the size,
        count or pending limits are skipped and counted. Shares the upload
        concurrency limit (weight 2).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyAttachmentsRequest"
      responses:
        "201":
          description: Copies created (possibly none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyAttachmentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Account (missing/invalid `accountId` included) or message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The raw message is not synchronized yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "422":
          description: The raw message could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Too many uploads/copies in progress (`Retry-After` 2)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/messages/{id}/draft:
    post:
      operationId: openMessageAsDraft
      tags:
        - compose
      summary: Open a message of the IMAP Drafts folder for editing
      description: |
        Returns the draft the message belongs to (200), or creates one from
        it (201). On creation the message's attachments are copied into
        uploads of the new draft; `attachmentsSkipped` counts the ones that
        could not be copied (the original then stays in the Drafts folder).
        No request body.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Existing draft of this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "201":
          description: Draft created from the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The message body is not synchronized yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/messages/{id}/html:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getMessageHtml
      tags:
        - messages
      summary: Get the sanitized HTML body
      description: |
        Extracted on demand from the encrypted raw mail and sanitized. Inline
        `cid:` raster images are embedded as `data:` URLs (size-limited);
        remote images are removed unless `remote=1`. `html` is null when the
        message has no HTML part, its raw source is not synced yet, or it
        cannot be read/parsed. Render only in a sandboxed iframe.
      parameters:
        - name: remote
          in: query
          required: false
          description: "`1` keeps remote images/backgrounds; any other value blocks them."
          schema:
            type: string
            enum:
              - "0"
              - "1"
      responses:
        "200":
          description: Sanitized HTML body
          headers:
            Cache-Control:
              description: Always `no-store`
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHtmlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/messages/actions:
    post:
      operationId: applyMessageAction
      tags:
        - messages
      summary: Apply an action to messages of one folder
      description: |
        Read/unread, flag/unflag, archive, delete or move messages of ONE
        folder. Applied to the local database immediately (optimistic); the
        write-back to the IMAP server is queued as a job. `delete` moves to
        Trash, or deletes permanently when the folder is Trash. `archive`
        and `delete` need an Archive/Trash folder (else 409). Messages that
        are still being moved (placeholder location) answer 409 until their
        new UID is known.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageActionRequest"
      responses:
        "200":
          description: Action applied locally; write-back queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageActionResponse"
        "400":
          description: Invalid request, or message already in the target/archive folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Folder, a message in that folder, or target folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No Archive/Trash folder for the account, or a message is still being moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/metrics:
    get:
      operationId: getMetrics
      tags:
        - system
      summary: Prometheus metrics
      description: |
        Disabled (404) unless `METRICS_TOKEN` is configured. Requires
        `Authorization: Bearer <METRICS_TOKEN>`; no session needed.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format (version 0.0.4)
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or wrong metrics token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Metrics endpoint disabled (no `METRICS_TOKEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/oauth/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: startOAuth
      tags:
        - accounts
      summary: Start the sign-in with an OAuth provider
      description: |
        Returns the authorization URL (code flow with PKCE); the PWA
        navigates there. The state is single use and valid for 10 minutes.
        With `accountId` an existing `oauth2` account of this provider signs
        in again (expired or revoked grant); the provider must then return
        the same mailbox. The result comes back via GET /api/oauth/callback.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown provider, or `accountId` is not an `oauth2` account of this provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Provider not configured (`NOT_CONFIGURED`) or no public address (`NO_PUBLIC_URL`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartConflict"
  /api/oauth/callback:
    get:
      operationId: oauthCallback
      tags:
        - accounts
      summary: Redirect target of the OAuth provider
      security: []
      description: |
        Called by the browser coming back from the provider, without the
        session cookie (SameSite=Strict); the state identifies the sign-in.
        Exchanges the code, tests IMAP and SMTP with XOAUTH2, then creates
        the account or stores new tokens for the existing one, and queues a
        folder sync. Always answers with a redirect to the PWA:
        `/?oauth=connected&account={id}` or
        `/?oauth=error&reason={reason}[&code={AccountErrorCode}]` with reason
        one of `state`, `denied`, `not_configured`, `invalid_client`, `provider`, `network`,
        `no_refresh_token`, `no_email`, `invalid_grant`, `imap`, `smtp`,
        `wrong_account`, `limit`.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the PWA with the result
          headers:
            Location:
              schema:
                type: string
  /api/oauth/providers:
    get:
      operationId: listOAuthProviders
      tags:
        - accounts
      summary: OAuth providers configured on this instance
      description: |
        Sign-in with Google or Microsoft (ADR-0011) is offered only for
        providers whose client id and secret are configured
        (`OAUTH_GOOGLE_*`, `OAUTH_MICROSOFT_*`). `redirectUri` is the address
        to register at the provider; null without `PUBLIC_URL`/`DOMAIN`.
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/outbox:
    post:
      operationId: sendMessage
      tags:
        - compose
      summary: Queue a plain-text message for sending
      description: |
        Validates the message, stores it encrypted and enqueues a
        `send_message` job (SMTP worker). The Message-ID is generated once
        here. With `clientId` the request is idempotent: a repeat with a
        known id answers 200 with the existing entry instead of sending
        again. `draftId` deletes that draft (unknown ids are ignored).
        `attachmentIds` binds uploads of the same account to the message.
        Body limit 4 MiB. Rate limit rule `send` (60/min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Repeat with a known `clientId`; the message queued the first time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxMessage"
        "201":
          description: Message queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Account or explicit identity not found (or not owned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "410":
          description: |
            At least one `attachmentIds` entry is gone (expired, removed or
            already sent). Nothing is stored or sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentMissingResponse"
        "413":
          description: Request body over 4 MiB, or attachments together exceed `MAX_ATTACHMENTS_TOTAL_BYTES`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/outbox/{id}:
    get:
      operationId: getOutboxMessage
      tags:
        - compose
      summary: Get the status of an outbox message
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Outbox entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/outbox/{id}/retry:
    post:
      operationId: retryOutboxMessage
      tags:
        - compose
      summary: Re-queue a failed message
      description: |
        Only messages with status `failed` can be retried; the error is
        cleared and a new `send_message` job is enqueued. No request body.
        Rate limit rule `send` (60/min per IP).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Message re-queued (status `queued`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Message is not in status `failed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/push/subscriptions:
    get:
      operationId: listPushSubscriptions
      tags:
        - push
      summary: List push subscriptions
      description: Active subscriptions of non-revoked devices, current device first. Never returns endpoints or keys.
      responses:
        "200":
          description: Subscriptions of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPushSubscription
      tags:
        - push
      summary: Register this browser's push subscription
      description: |
        Stores the subscription for the current device. Upsert by endpoint:
        an endpoint already known for this user moves to the current device
        and is re-enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "201":
          description: Subscription stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionCreated"
        "400":
          description: Invalid endpoint (not https, private host, too long) or invalid keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The endpoint belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deletePushSubscriptionByEndpoint
      tags:
        - push
      summary: Unsubscribe this browser (by endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "204":
          description: Subscription removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/push/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deletePushSubscription
      tags:
        - push
      summary: Remove a push subscription (device management)
      responses:
        "204":
          description: Subscription removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags:
        - push
      summary: Get the instance's VAPID public key
      responses:
        "200":
          description: VAPID public key, or null when the instance has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/search:
    get:
      operationId: searchGlobal
      tags:
        - messages
      summary: Search all accounts at their providers (IMAP SEARCH)
      description: |
        Searches the given accounts (default: all accounts that are not
        disabled) one after the other, each with its own deadline, and merges
        the matches by date. An account that fails, times out, has an
        authentication error or is rate limited gets that status in
        `accounts`; the others still deliver. Criteria as for
        `GET /api/accounts/{id}/search`; `folderId` needs exactly one account
        in `accounts`.

        Paging: `nextCursor` continues the same search. The matching UIDs are
        kept for 5 minutes (ids only, never the terms), so later pages need no
        new provider search; after that the cursor searches again and
        continues where it was. A cursor only fits its own query (otherwise
        400). Each provider search counts against the account's limit of 10
        per minute. The query is never logged or stored.
      parameters:
        - name: q
          in: query
          required: false
          description: Any text in headers and body (IMAP TEXT); trimmed, max 200 characters.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: subject
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/SearchTo"
        - $ref: "#/components/parameters/SearchUnread"
        - $ref: "#/components/parameters/SearchAttachment"
        - $ref: "#/components/parameters/SearchIncludeJunk"
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: folderId
          in: query
          required: false
          description: Only this folder (requires exactly one account in `accounts`).
          schema:
            type: string
            format: uuid
        - name: accounts
          in: query
          required: false
          description: Comma-separated account ids (at most 50); default all accounts that are not disabled.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` of the previous page (same criteria)."
          schema:
            type: string
      responses:
        "200":
          description: One page of search results
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResponse"
        "400":
          description: Invalid or missing criteria, parameters or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: An account in `accounts` was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/settings:
    get:
      operationId: getSettings
      tags:
        - settings
      summary: Get user settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSettings
      tags:
        - settings
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Settings after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: "`unifiedInbox` missing or not a boolean"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/storage:
    get:
      operationId: getStorage
      tags:
        - storage
      summary: Storage usage of all accounts
      responses:
        "200":
          description: Usage per account (in account order) plus the total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sync:
    post:
      operationId: syncAllAccounts
      tags:
        - accounts
      summary: Request a sync of all accounts
      description: |
        Enqueues a folder sync for every account where allowed. Accounts
        that are skipped (including rate-limited ones) are only reported;
        the request itself always succeeds.
      responses:
        "200":
          description: One result per account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAllResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/sync/cancel:
    post:
      operationId: cancelAllSyncs
      tags:
        - accounts
      summary: Stop the syncs of all accounts
      description: |
        Like `POST /api/accounts/{id}/sync/cancel` for every account of the
        user.
      responses:
        "200":
          description: One result per account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCancelAllResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/sync/status:
    get:
      operationId: getSyncStatus
      tags:
        - accounts
      summary: Sync state and progress of all accounts
      description: |
        One entry per account of the user, in account order. Ids, numbers,
        codes and times only - folder names are resolved by the client from
        its folder list. Cheap (one grouped select); meant for polling every
        2-3 s while a sync runs (`state` running, queued or cancelling) and
        not otherwise.
      responses:
        "200":
          description: Sync state per account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/themes:
    get:
      operationId: listThemes
      tags:
        - settings
      summary: Installed themes of the user
      responses:
        "200":
          description: Installed themes, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: installTheme
      tags:
        - settings
      summary: Install or update a theme
      description: |
        The body is the theme file (`*.fmatheme.json`, at most 32 KB). Only
        fields and values of docs/themes/schema.json pass (no code, no free
        CSS, no URLs); text/background pairs below 4.5:1 contrast in light
        or dark are listed in `warnings` (installed anyway). A theme with an installed `id` replaces it (200).
        At most 20 themes per user. Which theme is active is chosen per
        device in the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeFile"
      responses:
        "200":
          description: Installed theme replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledTheme"
        "201":
          description: Theme installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledTheme"
        "400":
          description: Not JSON or not a valid theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 20 themes are installed already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: Larger than 32 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeError"
  /api/themes/{id}:
    delete:
      operationId: deleteTheme
      tags:
        - settings
      summary: Delete an installed theme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,47}$
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/threads/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getThread
      tags:
        - messages
      summary: Get a conversation
      description: |
        Messages of the conversation across all folders of the account
        (e.g. including Sent): the newest 200, returned oldest first.
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/unified/inbox:
    get:
      operationId: listUnifiedInbox
      tags:
        - messages
      summary: List the unified inbox (paginated, opt-in)
      description: |
        INBOX messages of all accounts, newest first, with the account and
        folder each one belongs to. Only available while the user setting
        `unifiedInbox` is on; otherwise 404. Same keyset pagination as the
        folder list.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor (`nextCursor` of the previous page); malformed values answer 400.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size; values above 100 are clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedMessageListResponse"
        "400":
          description: Invalid `cursor` or `limit`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unified inbox is switched off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api/uploads/{id}:
    delete:
      operationId: deleteUpload
      tags:
        - compose
      summary: Remove an upload not yet attached to a message
      description: Also removes uploads kept with a draft. Uploads bound to an outbox message answer 404.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Upload removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
