    MessageDetail:
      type: object
      required:
        - id
        - accountId
        - folderIds
        - subject
        - from
        - to
        - cc
        - replyTo
        - deliveredTo
        - date
        - flags
        - hasAttachments
        - messageId
        - references
        - text
        - threadId
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        folderIds:
