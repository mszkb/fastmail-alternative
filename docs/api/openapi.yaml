          items:
            $ref: "#/components/schemas/SearchResultItem"
        providerMatches:
          type: integer
          minimum: 0
          description: All matches the provider reported in the searched folders.
        notSynced:
          type: integer
          minimum: 0
          description: Matches without a local copy (not synced or outside the sync window).
        truncated:
          type: boolean
          description: More local matches than returned, or too many provider matches to map.
        foldersSearched:
          type: integer
          minimum: 0
        foldersFailed:
          type: integer
          minimum: 0
          description: Folders that could not be searched.
    SearchProviderError:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - AUTH_FAILED
            - BLOCKED_HOST
            - BLOCKED_PORT
            - TIMEOUT
            - TLS_REQUIRED
            - UNREACHABLE
    HealthStatus:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
          enum:
            - api
            - worker
            - web
        version:
          type: string
          description: "`APP_VERSION` of the running build"
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              enum:
                - ok
                - down
    AuthStatus:
      type: object
      required:
        - needsSetup
        - authenticated
      properties:
        needsSetup:
          type: boolean
          description: No user exists yet; the client shows the setup page.
        authenticated:
          type: boolean
        email:
          type: string
          format: email
