            - TIMEOUT
            - TLS_ERROR
            - TLS_REQUIRED
            - BLOCKED_HOST
            - BLOCKED_PORT
            - UNKNOWN
        message:
          type: string
          description: Human-readable error text on failure (never provider texts).
        capabilities:
          type: array
          items:
            type: string
          description: IMAP capabilities on success (IMAP test only).
    ConnectionTestPair:
      type: object
      required:
        - imap
