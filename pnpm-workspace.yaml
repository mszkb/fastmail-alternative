packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'
  - '@vue/language-core@3.3.12'
  - vue-tsc@3.3.12
allowBuilds:
  esbuild: true
# pnpm audit (CI, ASVS N5): ignored advisories have no patched version and
# only reach the Nuxt build toolchain of apps/web, never a runtime image
# (web ships static files in nginx). Review when Dependabot offers updates.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge via listhen (nuxt dev server certs)
    - GHSA-vfj7-8cjw-p6xm # braces via micromatch (nitropack globbing)
    # simple-git via @nuxt/devtools (dev server only). Fixed in simple-git 4,
    # which devtools 3.x does not allow yet (^3.36).
    - GHSA-x6jw-m9v5-85vh
    - GHSA-v5rq-49vh-5v5c
    - GHSA-858h-whjf-mvg5
    - GHSA-g4wm-2vf7-vfgr
