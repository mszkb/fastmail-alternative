# Deployment per ADR-0007/ADR-0013: caddy, web (static PWA), php (php-fpm
# for /api/*), worker (job loop + IMAP IDLE, same image) and MariaDB.
# Configuration via .env (see .env.example). Without .env the one-shot
# `secrets` service generates MASTER_KEY, VAPID keys and the database
# password on the first start (volume app-secrets, #164, ADR-0016); values
# set in .env always win. scripts/setup-env.sh stays an optional way.
# Operators who bring their own reverse proxy can remove the caddy service;
# everything else keeps working.
#
# Resource policy (lean self-hosting): every service has a memory limit so
# the stack cannot exhaust a small VPS/Raspberry Pi, and logs are rotated.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-php-env: &php-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DOMAIN: ${DOMAIN:-:80}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  MAIL_DATA_DIR: /data/mail
  # Empty = generated value from SECRETS_FILE (#164).
  MASTER_KEY: ${MASTER_KEY:-}
  MASTER_KEY_ID: ${MASTER_KEY_ID:-v1}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  MAIL_ALLOW_PRIVATE_HOSTS: ${MAIL_ALLOW_PRIVATE_HOSTS:-}
  MAIL_EXTRA_PORTS: ${MAIL_EXTRA_PORTS:-}
  AUTOCONFIG_ISPDB: ${AUTOCONFIG_ISPDB:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
  SYNC_MIN_INTERVAL_SECONDS: ${SYNC_MIN_INTERVAL_SECONDS:-10}
  IMAP_IDLE: ${IMAP_IDLE:-1}
  IMAP_IDLE_MAX_CONNECTIONS: ${IMAP_IDLE_MAX_CONNECTIONS:-50}
  IMAP_MAX_CONNECTIONS_PER_HOST: ${IMAP_MAX_CONNECTIONS_PER_HOST:-4}
  MAX_RAW_MESSAGE_BYTES: ${MAX_RAW_MESSAGE_BYTES:-20971520}
  MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
  MAX_ATTACHMENTS_TOTAL_BYTES: ${MAX_ATTACHMENTS_TOTAL_BYTES:-14680064}
  CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
  JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-7}
  FAILED_JOB_RETENTION_DAYS: ${FAILED_JOB_RETENTION_DAYS:-30}
  UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-168}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  ORPHAN_FILE_GRACE_HOURS: ${ORPHAN_FILE_GRACE_HOURS:-24}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_NAME: ${MARIADB_DATABASE:-mail}
  DB_USER: ${MARIADB_USER:-mail}
  DB_PASSWORD: ${MARIADB_PASSWORD:-}
  SECRETS_FILE: /data/secrets/secrets.json

services:
  # One-shot: generates the secrets .env does not set (never replaces one),
  # as root so the files get their owners (secrets.json www-data 0600,
  # mariadb_password root 0400). Logs only names, never values.
  secrets:
    image: fma-server-php:local
    restart: 'no'
    logging: *default-logging
    mem_limit: 64m
    user: root
    command: ['php', 'bin/secrets.php', 'init']
    environment:
      SECRETS_DIR: /data/secrets
      MASTER_KEY: ${MASTER_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
    volumes:
      - app-secrets:/data/secrets

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      php:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # php-fpm for /api/* (FastCGI on 9000, only inside the compose network).
  # Applies migrations on start (Dockerfile CMD).
  php:
    build:
      context: apps/server-php
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    volumes:
      # Encrypted raw mails, attachments and uploads (ADR-0001).
      - mail-data:/data/mail
      - app-secrets:/data/secrets:ro
    environment:
      <<: *php-env
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

  # Long-running worker (job loop + IMAP IDLE) instead of cron; same image.
  worker:
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ['php', 'bin/worker.php']
    volumes:
      - mail-data:/data/mail
      - app-secrets:/data/secrets:ro
    environment:
      <<: *php-env
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    # The loop touches the heartbeat file after each pass; stale = stuck.
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          '$$f = "/tmp/worker-heartbeat"; exit(is_file($$f) && time() - filemtime($$f) < 120 ? 0 : 1);',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      php:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Single-user tuning: small buffer pool, few connections.
    command:
      [
        '--innodb-buffer-pool-size=64M',
        '--max-connections=30',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
      ]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mail}
      MARIADB_USER: ${MARIADB_USER:-mail}
      # Written by `secrets`: MARIADB_PASSWORD from .env, else a generated one.
      MARIADB_PASSWORD_FILE: /run/fma-secrets/mariadb_password
      # Root is not needed by the app; a random one is printed once to the log.
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - mariadb-data:/var/lib/mysql
      - app-secrets:/run/fma-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mariadb-data:
  mail-data:
  # Generated secrets (#164); not part of the backups - export the MASTER_KEY separately.
  app-secrets:
  caddy-data:
  caddy-config:
