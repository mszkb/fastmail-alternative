# Deployment per ADR-0007. Configuration via .env (see .env.example and
# scripts/setup-env.mjs). Operators who bring their own reverse proxy can
# remove the caddy service and proxy everything to api:3001 (the api also
# serves the PWA); everything else keeps working.
#
# Resource policy (lean self-hosting): every service has a memory limit so
# the stack cannot exhaust a small VPS/Raspberry Pi, and logs are rotated.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    volumes:
      # Read-only: the api decrypts raw mails on demand (HTML view, 2.9);
      # only the worker writes the volume.
      - mail-data:/app/mail-data:ro
    environment:
      NODE_ENV: production
      DOMAIN: ${DOMAIN:-:80}
      MAIL_DATA_DIR: /app/mail-data
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
      MAX_ATTACHMENTS_TOTAL_BYTES: ${MAX_ATTACHMENTS_TOTAL_BYTES:-14680064}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (scripts/setup-env.mjs)}
      MASTER_KEY_ID: ${MASTER_KEY_ID:-v1}
      # Public key only: the api hands it to browsers; sending is the worker's job.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Headroom for IMAP sync peaks: a large body costs up to ~5x its size
    # while it is downloaded, encrypted and parsed (MAX_RAW_MESSAGE_BYTES,
    # default 20 MB -> ~100 MB), at most one per job slot (WORKER_CONCURRENCY).
    mem_limit: 384m
    volumes:
      # Encrypted raw mails and attachments (ADR-0001).
      - mail-data:/app/mail-data
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_DATA_DIR: /app/mail-data
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
      IMAP_IDLE: ${IMAP_IDLE:-1}
      IMAP_IDLE_MAX_CONNECTIONS: ${IMAP_IDLE_MAX_CONNECTIONS:-50}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MAX_RAW_MESSAGE_BYTES: ${MAX_RAW_MESSAGE_BYTES:-20971520}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-7}
      FAILED_JOB_RETENTION_DAYS: ${FAILED_JOB_RETENTION_DAYS:-30}
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-168}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      ORPHAN_FILE_GRACE_HOURS: ${ORPHAN_FILE_GRACE_HOURS:-24}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (scripts/setup-env.mjs)}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    # No healthcheck yet: the worker gets real jobs (IMAP/SMTP/push) in phase 2.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Single-user tuning: small buffers, few connections.
    command:
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    # Loopback-only port for local development and SSH-tunnel access to the
    # Pi deployment (not reachable from the network).
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  # Encrypted mail bodies and attachments (ADR-0001), used from phase 2 on.
  mail-data:
  caddy-data:
  caddy-config:
