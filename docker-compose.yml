# Deployment per ADR-0007/ADR-0013: caddy, web (static PWA), php (php-fpm
# for /api/*), worker (job loop + IMAP IDLE, same image) and MariaDB.
# Configuration via .env (see .env.example and scripts/setup-env.sh).
# Operators who bring their own reverse proxy can remove the caddy service;
# everything else keeps working.
#
# Resource policy (lean self-hosting): every service has a memory limit so
# the stack cannot exhaust a small VPS/Raspberry Pi, and logs are rotated.
#
# No fixed project name: volumes (mail-data!) keep the names of the former
# Node stack in the same directory, so an upgrade reuses them. The profile
# "migration" (postgres-legacy, pg-import) is only for the one-time move from
# PostgreSQL (scripts/migrate-to-php.sh, docs/operations/migration.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-php-env: &php-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DOMAIN: ${DOMAIN:-:80}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  MAIL_DATA_DIR: /data/mail
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (scripts/setup-env.sh)}
  MASTER_KEY_ID: ${MASTER_KEY_ID:-v1}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  MAIL_ALLOW_PRIVATE_HOSTS: ${MAIL_ALLOW_PRIVATE_HOSTS:-}
  MAIL_EXTRA_PORTS: ${MAIL_EXTRA_PORTS:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
  SYNC_MIN_INTERVAL_SECONDS: ${SYNC_MIN_INTERVAL_SECONDS:-10}
  IMAP_IDLE: ${IMAP_IDLE:-1}
  IMAP_IDLE_MAX_CONNECTIONS: ${IMAP_IDLE_MAX_CONNECTIONS:-50}
  IMAP_MAX_CONNECTIONS_PER_HOST: ${IMAP_MAX_CONNECTIONS_PER_HOST:-4}
  MAX_RAW_MESSAGE_BYTES: ${MAX_RAW_MESSAGE_BYTES:-20971520}
  MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
  MAX_ATTACHMENTS_TOTAL_BYTES: ${MAX_ATTACHMENTS_TOTAL_BYTES:-14680064}
  CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_NAME: ${MARIADB_DATABASE:-mail}
  DB_USER: ${MARIADB_USER:-mail}
  DB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      php:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # php-fpm for /api/* (FastCGI on 9000, only inside the compose network).
  # Applies migrations on start (Dockerfile CMD).
  php:
    build:
      context: apps/server-php
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    volumes:
      # Encrypted raw mails, attachments and uploads (ADR-0001).
      - mail-data:/data/mail
    environment:
      <<: *php-env
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

  # Long-running worker (job loop + IMAP IDLE) instead of cron; same image.
  worker:
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ['php', 'bin/worker.php']
    volumes:
      - mail-data:/data/mail
    environment:
      <<: *php-env
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    # The loop touches the heartbeat file after each pass; stale = stuck.
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          '$$f = "/tmp/worker-heartbeat"; exit(is_file($$f) && time() - filemtime($$f) < 120 ? 0 : 1);',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      php:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Single-user tuning: small buffer pool, few connections.
    command:
      [
        '--innodb-buffer-pool-size=64M',
        '--max-connections=30',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
      ]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mail}
      MARIADB_USER: ${MARIADB_USER:-mail}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      # Root is not needed by the app; a random one is printed once to the log.
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --- One-time move from the Node stack (profile "migration") ---
  # The PostgreSQL of the former stack on its old volume, only reachable
  # inside the compose network while scripts/migrate-to-php.sh runs.
  postgres-legacy:
    profiles: ['migration']
    image: postgres:17-alpine
    logging: *default-logging
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-mail}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The PHP image plus pdo_pgsql: applies the migrations and imports the
  # old database (apps/server-php/bin/import-postgres.php).
  pg-import:
    profiles: ['migration']
    build:
      context: apps/server-php
      target: import
    image: fma-server-php-import:local
    logging: *default-logging
    environment:
      <<: *php-env
      LEGACY_DATABASE_URL: postgres://${POSTGRES_USER:-mail}:${POSTGRES_PASSWORD:-}@postgres-legacy:5432/${POSTGRES_DB:-mail}
    command: ['sh', '-c', 'php bin/migrate.php && php bin/import-postgres.php "$$LEGACY_DATABASE_URL"']
    depends_on:
      mariadb:
        condition: service_healthy
      postgres-legacy:
        condition: service_healthy

volumes:
  mariadb-data:
  mail-data:
  caddy-data:
  caddy-config:
  # Only read by the migration profile; delete it after a successful move.
  postgres-data:
