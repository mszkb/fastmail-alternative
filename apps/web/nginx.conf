server {
	listen 3000;
	root /usr/share/nginx/html;
	index index.html;
	server_tokens off;

	# Security headers incl. CSP (roadmap 6.4), generated at build time by
	# scripts/build-csp.mjs. nginx drops server-level add_header in any
	# location with its own add_header, so every such location includes the
	# snippet again.
	include /etc/nginx/snippets/security-headers.conf;

	# SPA fallback for client-side routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Hashed assets are immutable, HTML must be revalidated
	location /_nuxt/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/security-headers.conf;
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/security-headers.conf;
	}

	# Service worker and manifest: always revalidate, so a new version is
	# detected right away (roadmap 4.1). Service-Worker-Allowed is not needed,
	# the worker lives at the root.
	location = /sw.js {
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/security-headers.conf;
	}

	location = /manifest.webmanifest {
		types { }
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/security-headers.conf;
	}

	# Icons are not hashed: cache for a day, then revalidate.
	location /icons/ {
		add_header Cache-Control "public, max-age=86400";
		include /etc/nginx/snippets/security-headers.conf;
	}
}
