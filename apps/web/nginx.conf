server {
	listen 3000;
	root /usr/share/nginx/html;
	index index.html;

	# SPA fallback for client-side routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Hashed assets are immutable, HTML must be revalidated
	location /_nuxt/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# Service worker and manifest: always revalidate, so a new version is
	# detected right away (roadmap 4.1). Service-Worker-Allowed is not needed,
	# the worker lives at the root.
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}

	location = /manifest.webmanifest {
		types { }
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
	}

	# Icons are not hashed: cache for a day, then revalidate.
	location /icons/ {
		add_header Cache-Control "public, max-age=86400";
	}
}
