# PREVIEW (#109, ADR-0013): PHP backend with MariaDB instead of the Node api,
# worker and PostgreSQL. Does not replace docker-compose.yml and does not
# migrate data (PostgreSQL import: apps/server-php/bin/import-postgres.php).
#
#   docker compose -f docker-compose.php.yml up -d --build
#
# Configuration via .env (scripts/setup-env.mjs): MASTER_KEY, VAPID_*,
# MARIADB_PASSWORD. Guide: docs/operations/installation-php.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-php-env: &php-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DOMAIN: ${DOMAIN:-:80}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  MAIL_DATA_DIR: /data/mail
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (scripts/setup-env.mjs)}
  MASTER_KEY_ID: ${MASTER_KEY_ID:-v1}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  MAIL_ALLOW_PRIVATE_HOSTS: ${MAIL_ALLOW_PRIVATE_HOSTS:-}
  MAIL_EXTRA_PORTS: ${MAIL_EXTRA_PORTS:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_NAME: ${MARIADB_DATABASE:-mail}
  DB_USER: ${MARIADB_USER:-mail}
  DB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile.php:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      php:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # php-fpm for /api/* (FastCGI on 9000, only inside the compose network).
  # Applies migrations on start (Dockerfile CMD).
  php:
    build:
      context: apps/server-php
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    volumes:
      # Encrypted raw mails, attachments and uploads (ADR-0001).
      - mail-data:/data/mail
    environment:
      <<: *php-env
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

  # Long-running worker (job loop + IMAP IDLE) instead of cron; same image.
  worker:
    image: fma-server-php:local
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    command: ['php', 'bin/worker.php']
    volumes:
      - mail-data:/data/mail
    environment:
      <<: *php-env
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    # The loop touches the heartbeat file after each pass; stale = stuck.
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          '$$f = "/tmp/worker-heartbeat"; exit(is_file($$f) && time() - filemtime($$f) < 120 ? 0 : 1);',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      php:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Single-user tuning: small buffer pool, few connections.
    command:
      [
        '--innodb-buffer-pool-size=64M',
        '--max-connections=30',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
      ]
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mail}
      MARIADB_USER: ${MARIADB_USER:-mail}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      # Root is not needed by the app; a random one is printed once to the log.
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mariadb-data:
  mail-data:
  caddy-data:
  caddy-config:
